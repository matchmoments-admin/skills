name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      # stdlib unittest, no pip install — same constraint as validate_skills.py,
      # which hand-rolls a YAML parser to keep CI runnable on a stock image.
      - name: Video toolkit tests
        run: |
          python3 -m unittest discover \
            -s skills/video-toolkit/scripts/tests \
            -t skills/video-toolkit/scripts

      - name: Verify install scripts are executable
        run: |
          test -x scripts/install.sh
          test -x scripts/uninstall.sh
          test -x scripts/update.sh
          test -x scripts/validate_skills.py

      - name: Dry-run install (verifies the script parses + would do the right thing)
        run: |
          mkdir -p /tmp/test-skills-dest
          CLAUDE_SKILLS_DIR=/tmp/test-skills-dest ./scripts/install.sh --dry-run
