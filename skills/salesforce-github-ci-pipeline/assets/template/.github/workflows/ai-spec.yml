name: ai-spec
# FLAG: repository variable AI_PLAN=true (the same switch as /plan: planning, before any build). BUTTONS on a spec issue
# (bigger work; the "New spec" form): tick "Write the spec with Claude" (or comment /spec). The to-spec skill, adapted
# to Salesforce and to running here (docs/agents/salesforce.md): Claude writes the Spec (problem, solution, user
# stories, decisions, testing, one-way doors, questions) as one comment, edited in place; /spec again revises it with
# the comments since. A person then ticks "Make it a story" on it: agent-free, in card-actions (pipe act).
# No scratch org, no push: Claude reads the issue and the repo and writes one file.
run-name: "${{ format('ai-spec #{0}', github.event.issue.number) }}"
on:
  issues:
    types: [labeled]
permissions:
  contents: write       # the event log only; the agent has no shell or git tools
  issues: write
  id-token: write
  checks: read
  statuses: read
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
jobs:
  off:
    if: github.event.label.name == 'ai:spec' && vars.AI_PLAN != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh issue comment "${{ github.event.issue.number }}" --body "AI planning is off (repository variable \`AI_PLAN\`). Write the spec yourself, or turn it on in Settings > Secrets and variables > Actions > Variables."
          gh issue edit "${{ github.event.issue.number }}" --remove-label "${{ github.event.label.name }}" || true
  write:
    if: github.event.label.name == 'ai:spec' && vars.AI_PLAN == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: spec-${{ github.event.issue.number }}
      cancel-in-progress: true   # a newer /spec replaces an older one
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEY: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Trusted pipeline code (main)
        uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline", persist-credentials: false }
      - run: echo ".pipeline/" >> .git/info/exclude
      - name: The code the story will be built on (the open sprint, else main), as /plan reads it
        run: |
          REL=$(node .pipeline/pipeline/bin/pipe.mjs context | sed -n 's/^RELEASE_BRANCH=//p')
          if [ -n "$REL" ] && git fetch -q origin "$REL"; then git checkout -q "origin/$REL"; echo "reading $REL"; else echo "no open sprint: reading main"; fi
      - uses: ./.pipeline/.github/actions/sf-auth   # read-only use: production's org-wide defaults for the context pack
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Show that Claude is on it, with a link
        run: node .pipeline/pipeline/bin/pipe.mjs spec pending "$KEY" --now "Claude is writing the spec (3 to 6 minutes)"
      - name: The issue, the spec so far, the comments, and the context pack
        run: node .pipeline/pipeline/bin/pipe.mjs spec context "$KEY" --out "$RUNNER_TEMP/spec-input.md"
      - uses: ./.pipeline/.github/actions/claude-agent
        with:
          role: spec
          key: ${{ env.KEY }}
          model: ${{ vars.AI_MODEL }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          allowed-bots: ${{ vars.PIPELINE_BOTS }}
          max-turns: "30"
          allowed-tools: "Read,Glob,Grep,Write"
          prompt: |
            Write the spec for issue #${{ env.KEY }}. Everything known so far is in ${{ runner.temp }}/spec-input.md (read it with the Read tool); it ends with "The codebase today" (what exists for the objects it names, and production's org-wide defaults). Look further in force-app/ with Glob, Grep and Read; follow CLAUDE.md and docs/agents/salesforce.md.
            Its "User stories" become the story's acceptance criteria word for word, so write each one testable on its own. Write the spec to ${{ runner.temp }}/spec.md with the Write tool. Do not write any other file.
      - name: Post it (agent-free)
        run: |
          [ -s "$RUNNER_TEMP/spec.md" ] || { echo "::error::no spec written"; exit 1; }
          node .pipeline/pipeline/bin/pipe.mjs spec post "$KEY" --file "$RUNNER_TEMP/spec.md"
      - name: A failed run says so (never left saying "writing")
        if: failure()
        run: node .pipeline/pipeline/bin/pipe.mjs spec pending "$KEY" --failed --now "Claude could not write the spec; tick the box again or comment /spec"
      - name: Remove the button label
        if: always()
        run: gh issue edit "$KEY" --remove-label "${{ github.event.label.name }}" || true
