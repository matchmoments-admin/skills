name: release-cut
# BUTTON: Actions > release-cut > Run workflow (at sprint end; or, with Jira, version released: repository_dispatch
# jira-release-cut). Opens the release PR (release/<sprint> -> main) with notes from merged PRs and the sprint's
# stories. Then approve it to ship. A Jira dispatch carries the released version, which must be the open sprint's
# name; anything else (a hotfix's version) cuts nothing.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [jira-release-cut]
permissions:
  contents: read
  actions: write        # starts CI on the release candidate without the App
  pull-requests: write
  issues: write         # the release card
  checks: read          # the card reads the PR's checks (the gate's facts)
  statuses: read        # whether UAT already has the release head (pipe next)
concurrency:
  group: release-cut          # one cut at a time: a duplicate fire waits, then finds the release PR open
  cancel-in-progress: false
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  cut:
    runs-on: ${{ vars.RUNNER_SMALL || 'ubuntu-slim' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # pipeline code from main, whatever ref this was started on
      - id: id
        uses: ./.github/actions/pipeline-identity
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          ref: main
      - name: The open sprint
        id: ctx
        run: node pipeline/bin/pipe.mjs context
      - name: A Jira release is the open sprint's (a hotfix's or another version cuts nothing)
        id: version
        if: github.event_name == 'repository_dispatch' && github.event.action == 'jira-release-cut'
        env:
          VERSION: ${{ github.event.client_payload.version }}   # the Automation rule sends {"version":"{{version.name}}"}
          SPRINT: ${{ steps.ctx.outputs.SPRINT }}
        run: |
          if [ -n "$SPRINT" ] && [ "$VERSION" = "$SPRINT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Jira released version '$VERSION', not the open sprint '${SPRINT:-none}': no release PR"; fi
      - name: Open the release pull request
        if: steps.version.outputs.ok != 'false'
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          REL: ${{ steps.ctx.outputs.RELEASE_BRANCH }}
          SPRINT: ${{ steps.ctx.outputs.SPRINT }}
        run: |
          [ -n "$REL" ] || { echo "::error::No open sprint"; exit 1; }
          if [ -n "$(gh pr list --head "$REL" --base main --state open --json number --jq '.[0].number // empty')" ]; then echo "release PR already open"; exit 0; fi
          node pipeline/bin/pipe.mjs release notes "$SPRINT" > notes.md
          gh pr create --base main --head "$REL" --title "Release $SPRINT" --body-file notes.md --label release
          GH_TOKEN="${{ github.token }}" node pipeline/bin/pipe.mjs pr card "$(gh pr list --head "$REL" --base main --state open --json number --jq '.[0].number')" || true
          [ "${{ steps.id.outputs.is-app }}" = "true" ] || gh workflow run ci.yml --ref "$REL" -f ref="$REL"
          # UAT_ENABLED: the release candidate goes to UAT once the staging regression has passed on it (journey.mjs);
          # if staging is still running, its end starts UAT instead
          GH_TOKEN="${{ github.token }}" node pipeline/bin/pipe.mjs next --after release-pr --pr "$(gh pr list --head "$REL" --base main --state open --json number --jq '.[0].number')"
