name: sprint-start
# BUTTON: Actions > sprint-start > Run workflow (or, with Jira, sprint started: repository_dispatch jira-sprint-start).
# Opens a sprint: tracker sprint (GitHub milestone), release branch from a green main, staging org. Re-running adopts
# what already exists.
on:
  workflow_dispatch:
    inputs:
      sprint:
        description: Sprint name, for example 2026-w43
        required: true
      start:
        description: "Optional: a story to start once the sprint is open (set when the sprint is started from that story)"
        required: false
        default: ""
  repository_dispatch:
    types: [jira-sprint-start]
permissions:
  contents: write
  issues: write
  checks: read          # main's CI must be green before a release branch is cut from it
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SPRINT: ${{ inputs.sprint || github.event.client_payload.sprint }}
      START: ${{ inputs.start }}
    steps:
      - name: A valid sprint name
        run: '[[ "$SPRINT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,40}$ && "$START" =~ ^[0-9]{0,7}$ ]] || { echo "::error::Sprint names use letters, digits, dot, dash or underscore"; exit 1; }'
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Names (is another sprint open?)
        id: ctx
        run: node pipeline/bin/pipe.mjs context
      - name: Open the sprint (tracker and release branch)
        env:
          OPEN: ${{ steps.ctx.outputs.RELEASE_BRANCH }}
        run: |
          if [ -n "$OPEN" ] && [ "$OPEN" != "release/$SPRINT" ]; then echo "::error::$OPEN is still open. Ship it first."; exit 1; fi
          # The release branch rules require green CI on the commit a release branch starts from.
          if ! git ls-remote --exit-code --heads origin "release/$SPRINT" >/dev/null; then
            # gate.checkPassed decides (a skipped scratch-org job passes: nothing to deploy), not a grep for "success"
            node pipeline/bin/pipe.mjs gate checks HEAD   # prints each check; writes green=
            if ! grep -q '^green=true' "$GITHUB_OUTPUT"; then echo "::error::CI on main's latest commit is not green yet (see above). Try again in a few minutes."; exit 1; fi
          fi
          node pipeline/bin/pipe.mjs tracker open-sprint "$SPRINT"
          if git ls-remote --exit-code --heads origin "release/$SPRINT" >/dev/null; then echo "release/$SPRINT exists"; else git push origin "HEAD:refs/heads/release/$SPRINT"; fi
      - uses: ./.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Staging org (adopts the sprint's live one on a re-run)
        run: |
          node pipeline/bin/pipe.mjs org ready "sprint:$SPRINT"
          node pipeline/bin/pipe.mjs org limits
      - id: app
        if: env.START != ''
        uses: actions/create-github-app-token@v1   # a label the App applies starts issue-start (the Actions token's start nothing)
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
      - name: The story the sprint was started from starts now
        if: env.START != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh issue edit "$START" --add-label start
      - name: Slack hears the sprint is open (stories waiting for it can start)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          LINK: ${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+-label%3Aspec
        run: |
          node --input-type=module -e '
            const { slackNotifier } = await import(process.cwd() + "/pipeline/src/notify.mjs");
            const repo = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`, n = process.env.START;
            const then = n ? `<${repo}/issues/${n}|#${n}> is starting now (its branch and scratch org); this channel hears when it is ready to build.` : `stories can start now: press *Start* on one (its card, or its last Slack message). <${process.env.LINK}|Open stories>`;
            await slackNotifier({ log: console.log })({ text: `🏁 *Sprint ${process.env.SPRINT} is open*: ${then}` });'
