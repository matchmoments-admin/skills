name: merged
# An emergency merge: someone allowed to bypass the branch rules (admins, plus any team the rules name) merged a PR
# without the gate. GitHub records the bypass in the audit log; this says so on the PR and the story, and starts the
# follow-ups the gate would have: staging for sprint work; for main the release, which validates against production
# itself before it deploys; and deleting the story's org. Merges made by the gate (the pipeline App) need nothing here.
on:
  pull_request_target:   # the base branch's own copy of this file; never runs the PR's code
    types: [closed]
permissions:
  actions: write
  contents: write       # the event log (the metrics branch)
  issues: write
  pull-requests: write
  checks: read
  statuses: read
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  emergency:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.merged_by.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      WHO: ${{ github.event.pull_request.merged_by.login }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: What the gate would have started
        id: f
        run: node pipeline/bin/pipe.mjs gate followups "$PR"
      - name: Say who bypassed the gate
        if: steps.f.outputs.after != ''
        env:
          AFTER: ${{ steps.f.outputs.after }}
        run: |
          gh pr comment "$PR" --body "$(printf '**Emergency merge** by @%s: merged without the pipeline gate (branch rules bypass; recorded in the organisation audit log). Follow-ups started as the gate would have: `%s`.' "$WHO" "$AFTER")"
      - uses: ./.github/actions/sf-auth
        if: contains(steps.f.outputs.after, 'delete-story-org')
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Follow-ups
        if: steps.f.outputs.after != ''
        env:
          AFTER: ${{ steps.f.outputs.after }}
          STORY: ${{ steps.f.outputs.story }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PIPELINE_APP_ID: ${{ secrets.PIPELINE_APP_ID }}
          PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        # no validation id: the release validates this commit first. The same command as the gate's follow-ups.
        run: node pipeline/bin/pipe.mjs start followups --after "$AFTER" --pr "$PR" --base "$BASE" --sha "$MERGED_SHA" --story "$STORY"
  closed:
    # A story PR closed without merging gives its scratch org back at once (it waited for the janitor's 6-hour sweep),
    # unless another PR on the same branch is still open (a PR replaced by a new one keeps its org).
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Is it a story with no other open PR?
        id: s
        run: |
          KEY=$(node pipeline/bin/pipe.mjs context --branch "$HEAD" | sed -n 's/^STORY=//p')
          OPEN=$(gh pr list --head "$HEAD" --state open --json number --jq 'length')
          if [ -n "$KEY" ] && [ "$OPEN" = 0 ]; then echo "story=$KEY" >> "$GITHUB_OUTPUT"; else echo "nothing to give back (story: ${KEY:-none}, open PRs on $HEAD: $OPEN)"; fi
      - uses: ./.github/actions/sf-auth
        if: steps.s.outputs.story != ''
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Give the story's org back
        if: steps.s.outputs.story != ''
        env:
          STORY: ${{ steps.s.outputs.story }}
          PIPELINE_APP_ID: ${{ secrets.PIPELINE_APP_ID }}
          PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: node pipeline/bin/pipe.mjs start followups --after delete-story-org --pr "$PR" --story "$STORY"
