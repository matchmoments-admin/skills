name: ai-fix
# FLAG: repository variable AI_FIX=true (off by default: a person pushes the fixes). Works on human review
# comments and failed CI checks, so it does not need AI_REVIEW.
# BUTTON: label a PR `ai:fix` or comment /fix. Claude fixes the blockers and majors from the review and the errors of
# a failed CI run, pushes, and the review runs again. At most two rounds per PR since a person last pushed (the route
# job decides, before the fix job starts: pipeline/src/start.mjs).
# The label only dispatches the real job with --ref main: a labelled PR runs the workflow file from GitHub's test merge
# commit, which can lag behind main, so fixes to this file would otherwise not reach open PRs.
run-name: "${{ inputs.pr && format('ai-fix PR #{0}', inputs.pr) || format('ai-fix (label on PR #{0})', github.event.pull_request.number) }}"   # the round limit counts these
on:
  pull_request_target:   # runs the base branch's own copy of this file (never the PR's code), so routing is never stale
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
permissions:
  actions: write        # dispatches itself on main; re-starts the review (and ci without the App)
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  checks: read          # the story card reads checks and verdicts
  statuses: read
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  route:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'ai:fix'
    runs-on: ${{ vars.RUNNER_SMALL || 'ubuntu-slim' }}
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "pipeline\nconfig", persist-credentials: false }
      # flag off, not a story, the blocked label, the round limit (it then blocks the PR and says what a person can
      # do, once): decided here in main's code (pipeline/src/start.mjs), so the fix job never starts only to stop
      - env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node pipeline/bin/pipe.mjs start fix --pr "$PR"
  fix:
    if: github.event_name == 'workflow_dispatch' && vars.AI_FIX == 'true'
    runs-on: ubuntu-latest
    # The agent can run code in this job, and later steps run in the same runner: so this job's token cannot post
    # verdicts (statuses) or start workflows (actions). Those happen in a separate job after it (the trust model).
    permissions:
      contents: write       # the org's lane (refs/locks) and the event log; pushes go as the pipeline App
      pull-requests: write
      issues: write
      id-token: write
      checks: read
      statuses: read
      actions: read         # the round limit lists earlier fix runs, and the failed UI test's log is downloaded (read only)
    outputs:
      is-app: ${{ steps.id.outputs.is-app }}
      branch: ${{ steps.pr.outputs.branch }}
      before: ${{ steps.lane.outputs.parked != 'true' && steps.head.outputs.before || '' }}   # parked: no follow-up
      budget: ${{ steps.budget.outputs.stopped }}   # the story's AI budget stopped the agent: its own comment says so
    timeout-minutes: 75   # 45 of them may be waiting for the story org's lane (when it cannot park)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
    steps:
      - name: The PR (validated)
        id: pr
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number"; exit 1; }
          J=$(gh pr view "$PR" --json headRefName,baseRefName,state)
          [ "$(jq -r .state <<<"$J")" = "OPEN" ] || { echo "::error::PR #$PR is not open"; exit 1; }
          echo "BRANCH=$(jq -r .headRefName <<<"$J")" >> "$GITHUB_ENV"
          echo "BASE=$(jq -r .baseRefName <<<"$J")" >> "$GITHUB_ENV"
          echo "branch=$(jq -r .headRefName <<<"$J")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { ref: "${{ steps.pr.outputs.branch }}", fetch-depth: 0 }
      - name: Trusted pipeline code (main)
        uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\nbaseline-facts\ndata/seed\ndocs/agents\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - run: echo ".pipeline/" >> .git/info/exclude
      - id: id
        uses: ./.pipeline/.github/actions/pipeline-identity
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          ref: ${{ steps.pr.outputs.branch }}
      - name: The story card says Claude is fixing it
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=$(node .pipeline/pipeline/bin/pipe.mjs context --branch "$BRANCH" | sed -n 's/^STORY=//p')
          echo "STORY_KEY=$KEY" >> "$GITHUB_ENV"
          [ -z "$KEY" ] || node .pipeline/pipeline/bin/pipe.mjs story card "$KEY" --now "Claude is fixing the review comments and failed checks (5 to 10 minutes)"
      - name: The head before the fix (the review runs again only on a new one)
        id: head
        run: echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.pipeline/.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: The org's lane (one job at a time in an org; busy, this job parks and is re-run when it frees)
        id: lane
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node .pipeline/pipeline/bin/pipe.mjs lane acquire "$BRANCH" --park fix   # a second fix while one waits is dropped
      - name: Attach the story's org and collect the feedback (review comments and failed CI)
        if: steps.lane.outputs.parked != 'true'
        id: org
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          READ_TOKEN: ${{ github.token }}   # reading run logs needs actions: read, which the Actions token has
        run: |
          node .pipeline/pipeline/bin/pipe.mjs org ready "$BRANCH" --pr "$PR"   # attaches or rebuilds (never for a merged PR); deploys this head unless the org holds it
          {
            echo "# Feedback on PR #$PR"
            gh pr view "$PR" --json comments --jq '.comments[] | select(.body | startswith("/") | not) | "\n## Comment by \(.author.login)\n\(.body)"'
            gh api --paginate "repos/$GH_REPO/pulls/$PR/comments" --jq '.[] | "\n## Inline on \(.path) line \(.line // .original_line)\n\(.body)"'
            # the newest failed CI run, preferring the PR's current head (a newer run may still be in progress)
            HEAD_SHA=$(git rev-parse HEAD)
            RUN=$(GH_TOKEN="$READ_TOKEN" gh run list --branch "$BRANCH" --workflow ci.yml --limit 10 --json databaseId,conclusion,headSha \
              --jq "([.[] | select(.conclusion==\"failure\" and .headSha==\"$HEAD_SHA\")] + [.[] | select(.conclusion==\"failure\")])[0].databaseId // empty")
            # the newest failed UI test of this PR: its Playwright error (the fixer cannot see the report otherwise)
            UI=$(GH_TOKEN="$READ_TOKEN" gh run list --workflow ui-test.yml --limit 20 --json databaseId,displayTitle,conclusion --jq "[.[] | select(.displayTitle | startswith(\"ui-test PR #$PR \")) | select(.conclusion==\"success\")][0].databaseId // empty")
            if [ -n "$UI" ] && GH_TOKEN="$READ_TOKEN" gh run download "$UI" -n playwright-report -D "$RUNNER_TEMP/ui" >/dev/null 2>&1 \
              && LOG=$(find "$RUNNER_TEMP/ui" -name playwright.log | head -1) && grep -qiE "failed|error" "$LOG" 2>/dev/null; then
              # the artifact's root shifts when ui-out is the only folder uploaded, so find the log (as ui-test.yml does)
              echo; echo "## Failed UI test (run $UI): the Playwright error"; tail -60 "$LOG"
            fi
            if [ -n "$RUN" ]; then
              echo; echo "## Failed CI checks (run $RUN): fix these first"
              GH_TOKEN="$READ_TOKEN" gh run view "$RUN" --log-failed | sed -E 's/\x1b\[[0-9;]*m//g; s/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ //' \
                | grep -vE 'completion|Executing rules|Selecting rules|^\s*$|##\[(group|endgroup)\]' | tail -60
            fi
          } > "$RUNNER_TEMP/review-feedback.md"
          grep -c "Failed CI checks" "$RUNNER_TEMP/review-feedback.md" | sed 's/^/failed-CI sections: /'
          if [ -n "$STORY_KEY" ]; then node .pipeline/pipeline/bin/pipe.mjs tracker story "$STORY_KEY" --pack --base "origin/$BASE" --out "$RUNNER_TEMP/story.md"; else echo "(no story)" > "$RUNNER_TEMP/story.md"; fi
      - name: Main's rules over the branch's copy (CLAUDE.md, REVIEW.md, docs/agents), hidden from git
        if: steps.lane.outputs.parked != 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs harness overlay fix   # after the branch is checked out and up to date
      - run: npm install --no-audit --no-fund --ignore-scripts   # the production key is still on disk here: no install scripts
        if: steps.lane.outputs.parked != 'true'
      - uses: ./.pipeline/.github/actions/claude-agent
        if: steps.lane.outputs.parked != 'true'
        with:
          role: fix
          key: ${{ env.STORY_KEY || 'N' }}   # its experiment arm and AI budget are the story's
          pr: ${{ env.PR }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          jira-email: ${{ secrets.JIRA_EMAIL }}   # only the budget stop's pipe step gets it (claude-agent)
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # only the anthropic-api and gateway providers use it (config/ai-models.json)
          github-token: ${{ steps.id.outputs.token }}
          allowed-bots: ${{ vars.PIPELINE_BOTS }}   # only the pipeline's own bots; empty = none
          allowed-tools: "Read,Glob,Grep,Edit,Write,Bash(sf:*),Bash(git:*),Bash(scripts/vendor.sh:*),Bash(npm run:*),Bash(npm install:*),Bash(npx prettier:*),Bash(npx sfdx-lwc-jest:*),Bash(ls:*),Bash(jq:*),Bash(gh pr edit:*)"
          prompt: |
            Fix the review findings and any failed CI checks on pull request #${{ env.PR }}. All feedback (review comments, inline comments, and the errors of a failed CI run, if any) is in ${{ runner.temp }}/review-feedback.md.
            Failed CI checks come first: they block the merge. Then address every [blocker] and [major]; ignore [minor] unless trivial. The latest comments win if they disagree.
            If your fix changes what the PR does, make its title and description say what is built now: write the description to a file with the Write tool and run `gh pr edit ${{ env.PR }} --title "<title>" --body-file <file>` (release notes are made from PR titles).
            The story (the scope; do not build beyond it) and "The codebase today" are in ${{ runner.temp }}/story.md. Follow CLAUDE.md, including its Access rules. A class "below 85%" in the failed tests needs the missing cases written as docs/agents/apex-testing.md says (the branch no test reaches), never padding.
            The scratch org alias is ${{ steps.org.outputs.alias }}: deploy with `sf project deploy start -o ${{ steps.org.outputs.alias }} -d force-app --ignore-conflicts`, run the Apex tests until they pass, and run `npm run format` before committing.
      - name: Let the next job into the org's lane
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node .pipeline/pipeline/bin/pipe.mjs lane release "$BRANCH" || true
      - name: Did the story's AI budget stop the agent? (the follow-up says so instead of "changed nothing")
        id: budget
        if: always()
        run: echo "stopped=${AI_BUDGET_STOPPED:-false}" >> "$GITHUB_OUTPUT"
      - name: Remove the button label
        if: always()
        run: gh pr edit "$PR" --remove-label ai:fix || true
      - name: The story card says the fix failed, and where to look
        if: failure() && env.STORY_KEY != '' && env.AI_BUDGET_STOPPED != 'true'
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node .pipeline/pipeline/bin/pipe.mjs story card "$STORY_KEY" --now "Claude's fix" --failed --retry "comment /fix to retry, or push a fix yourself"
  follow-up:
    # Fresh runner, no agent: the review again (and CI without the App), only if the fix pushed a new head. A fix that
    # pushed nothing starts nothing (that was an endless review/fix loop); the round limit stops it before it starts.
    needs: fix
    if: always() && needs.fix.result != 'skipped' && needs.fix.outputs.before != '' && needs.fix.outputs.budget != 'true'
    runs-on: ${{ vars.RUNNER_SMALL || 'ubuntu-slim' }}
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: write  # pipe start review: labels, the "not needed" verdict and the card
      statuses: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ needs.fix.outputs.branch }}
      BEFORE: ${{ needs.fix.outputs.before }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "pipeline\nconfig", persist-credentials: false }
      - env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          NOW=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          # a fix that changes nothing judged the review already met or wrong: say so, or the PR waits on a fix that never comes (#261)
          [ "$NOW" != "$BEFORE" ] || { echo "the fix pushed nothing: no new review"; gh pr comment "$PR" --body "Claude's fix changed nothing: it found the review's requests already met or not right for this story. If you agree, comment \`/review-ok <why>\`; otherwise push a fix yourself (the review runs again)."; exit 0; }
          [ "${{ vars.AI_REVIEW }}" != "true" ] || node pipeline/bin/pipe.mjs start review --pr "$PR"   # the review's start decision
          [ "${{ needs.fix.outputs.is-app }}" = "true" ] || gh workflow run ci.yml --ref "$BRANCH" -f ref="$BRANCH"
