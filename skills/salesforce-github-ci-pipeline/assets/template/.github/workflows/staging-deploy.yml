name: staging-deploy
# After a story merges into the release branch (started by the gate): deploy the whole release branch to the
# staging org and run the full regression. The job name is the "staging regression" check the release gate needs.
# Pipeline code comes from main (.pipeline/); the release branch's own specs run only after production access is gone.
# Scale (references/capacity.md, `pipe capacity`): UI_SHARDS=N runs the UI regression on N runners (shard 1 the persona
# specs, which share the org's user licences; the rest split over the others), all against this staging org while this
# run holds its lane. UI_RUNNER picks the runner (a larger one or self-hosted); UI_WORKERS browsers per runner (one per
# 2 cores: Lightning is CPU-heavy in the browser). Unset: one runner, one browser, as before.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
jobs:
  staging:
    name: staging deploy and Apex
    runs-on: ${{ vars.UI_RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: read         # the org lane checks whether the holder's run has ended (lane.mjs)
      contents: write       # the staging org's lane only (a ref under refs/locks/); the specs never see a token
      checks: write         # the live "Salesforce tests" check on the release head
    timeout-minutes: 75   # 45 of them may be waiting for the staging org's lane (release-PR CI, a back-merge)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      release: ${{ steps.ctx.outputs.RELEASE_BRANCH }}
      sprint: ${{ steps.ctx.outputs.SPRINT }}
      sharded: ${{ steps.ui.outputs.sharded }}   # true: the UI regression runs in the ui jobs, and this run keeps the lane
      shards: ${{ steps.ui.outputs.shards }}
      matrix: ${{ steps.ui.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\ndata/seed\ndocs/agents\ne2e/support\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - name: The open sprint
        id: ctx
        working-directory: .pipeline
        run: |
          node pipeline/bin/pipe.mjs context
          node pipeline/bin/pipe.mjs context | grep -q '^RELEASE_BRANCH=.' || { echo "::error::No open sprint"; exit 1; }
      - name: Still the release branch's tip? (each merge queues a run; only the newest needs to test)
        id: current
        run: |
          TIP=$(gh api "repos/$GH_REPO/commits/${{ steps.ctx.outputs.RELEASE_BRANCH }}" --jq .sha)
          if [ "$TIP" != "$GITHUB_SHA" ]; then echo "superseded=true" >> "$GITHUB_OUTPUT"; echo "superseded by ${TIP:0:7}: its own run tests it"; fi
      - name: Wait for the staging org's lane (nobody is dropped)
        if: steps.current.outputs.superseded != 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs lane acquire "sprint:${{ steps.ctx.outputs.SPRINT }}"
      - uses: actions/checkout@v4
        if: steps.current.outputs.superseded != 'true'
        with: { ref: "${{ github.sha }}", path: candidate, fetch-depth: 20, persist-credentials: false }   # exactly the commit this run is for (and the ones before it: #237)
      - name: Already tested? (a re-run of a commit that already passed)
        id: fresh
        if: steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: |
          SHA=$(git rev-parse HEAD)
          N=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?check_name=staging%20regression" --jq '[.check_runs[] | select(.conclusion=="success")] | length')
          if [ "$N" != "0" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; echo "${SHA:0:7} already passed the staging regression"; fi
          # a back-merge that changes nothing the regression tests keeps the pass of the commit before it (#237)
          if [ "$N" = "0" ]; then node ../.pipeline/pipeline/bin/pipe.mjs ci staging-carry | tee carry.txt; grep -q "passed on" carry.txt && echo "done=true" >> "$GITHUB_OUTPUT" || true; fi
      - uses: ./.pipeline/.github/actions/sf-auth
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Deploy the release branch to staging and prepare it
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: |
          node ../.pipeline/pipeline/bin/pipe.mjs org ready "sprint:${{ steps.ctx.outputs.SPRINT }}"   # this candidate, deployed and prepared
      - name: Full regression (every Apex and Flow test), live on the release head as "Salesforce tests"
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs tests run staging --all --base HEAD --sha "$(git rev-parse HEAD)" --out test-results
      - name: Where the UI regression runs (UI_SHARDS > 1 and specs to run = the ui jobs; else here)
        id: ui
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        env:
          N: ${{ vars.UI_SHARDS }}
        run: |
          [[ "$N" =~ ^[1-8]$ ]] || N=1
          if [ "$N" -gt 1 ] && ls e2e/*.spec.ts >/dev/null 2>&1; then
            { echo "sharded=true"; echo "shards=$N"; echo "matrix=[$(seq 1 "$N" | paste -sd, -)]"; } >> "$GITHUB_OUTPUT"
            echo "UI regression: $N runners"
          fi
      - name: Drop production access before running the branch's specs
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true' && steps.ui.outputs.sharded != 'true'
        run: |
          # loginAs reads these: once the Dev Hub is logged out, `sf org display` fails
          sf org display -o staging --json | jq -r '.result | "SCRATCH_ORG_ID=\(.id)\nSCRATCH_INSTANCE_URL=\(.instanceUrl)"' >> "$GITHUB_ENV"
          sf org logout -o devhub --no-prompt >/dev/null 2>&1 || true
          rm -f "${SF_CI_KEY_FILE:-}"
      - name: The test harness from main (login, personas, evidence), not the release branch's copy
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true' && steps.ui.outputs.sharded != 'true'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs harness overlay staging --from ../.pipeline
      - uses: ./.pipeline/.github/actions/playwright
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true' && steps.ui.outputs.sharded != 'true' && hashFiles('candidate/e2e/*.spec.ts') != ''
        env:
          GH_TOKEN: ""          # installs the branch's packages: no token
        with: { working-directory: candidate }
      - name: UI regression (every spec in e2e/)
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true' && steps.ui.outputs.sharded != 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ""
          UI_WORKERS: ${{ vars.UI_WORKERS }}
        run: |
          if ls e2e/*.spec.ts >/dev/null 2>&1; then
            SCRATCH_ALIAS=staging npx playwright test
          else
            echo "No UI specs yet"
          fi
      - name: Let the next job into the staging org's lane (sharded, the regression job does, after the shards)
        if: always() && steps.current.outputs.superseded != 'true' && steps.ui.outputs.sharded != 'true'
        working-directory: .pipeline
        run: node pipeline/bin/pipe.mjs lane release "sprint:${{ steps.ctx.outputs.SPRINT }}" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        with:
          name: staging-results
          path: |
            candidate/test-results
            candidate/playwright-report
            !candidate/**/trace.zip
            !candidate/**/*.webm
  ui:
    # One shard of the UI regression, on its own runner, against the staging org this run holds. Production access is
    # dropped before the branch's specs run, as in the staging job. Shard 1 runs the persona specs (one at a time: they
    # share the org's user licences); the others split the rest.
    name: staging UI ${{ matrix.shard }}/${{ needs.staging.outputs.shards }}
    needs: staging
    if: needs.staging.outputs.sharded == 'true'
    runs-on: ${{ vars.UI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.staging.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\ndata/seed\ndocs/agents\ne2e/support\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", path: candidate, persist-credentials: false }
      - uses: ./.pipeline/.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Log in to the staging org, then drop production access before running the branch's specs
        working-directory: .pipeline
        run: |
          node pipeline/bin/pipe.mjs org attach "sprint:${{ needs.staging.outputs.sprint }}" >/dev/null
          # loginAs reads these: once the Dev Hub is logged out, `sf org display` fails
          sf org display -o staging --json | jq -r '.result | "SCRATCH_ORG_ID=\(.id)\nSCRATCH_INSTANCE_URL=\(.instanceUrl)"' >> "$GITHUB_ENV"
          sf org logout -o devhub --no-prompt >/dev/null 2>&1 || true
          rm -f "${SF_CI_KEY_FILE:-}"
      - name: The test harness from main (login, personas, evidence), not the release branch's copy
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs harness overlay staging --from ../.pipeline
      - uses: ./.pipeline/.github/actions/playwright
        env:
          GH_TOKEN: ""          # installs the branch's packages: no token
        with: { working-directory: candidate }
      - name: UI regression, shard ${{ matrix.shard }}
        working-directory: candidate
        env:
          GH_TOKEN: ""
          UI_WORKERS: ${{ vars.UI_WORKERS }}
          SHARD: ${{ matrix.shard }}
          N: ${{ needs.staging.outputs.shards }}
        run: |
          export SCRATCH_ALIAS=staging
          if grep -lq "loginAs(" e2e/*.spec.ts 2>/dev/null; then
            if [ "$SHARD" = 1 ]; then npx playwright test --project persona
            else npx playwright test --project parallel --shard "$((SHARD - 1))/$((N - 1))" --pass-with-no-tests; fi
          else
            npx playwright test --shard "$SHARD/$N" --pass-with-no-tests
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-results-${{ matrix.shard }}
          path: |
            candidate/test-results
            candidate/playwright-report
            !candidate/**/trace.zip
            !candidate/**/*.webm
  regression:
    # The required check: the deploy and Apex job and every UI shard. Sharded, this run held the staging org's lane
    # through the shards, and lets go here.
    name: staging regression
    needs: [staging, ui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read         # the lane reads its holder's run
      contents: write       # the staging org's lane (a ref under refs/locks/)
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        if: needs.staging.outputs.sharded == 'true'
        with: { ref: main, sparse-checkout: "pipeline\nconfig", persist-credentials: false }
      - name: Let the next job into the staging org's lane
        if: needs.staging.outputs.sharded == 'true'
        run: node pipeline/bin/pipe.mjs lane release "sprint:${{ needs.staging.outputs.sprint }}" --holder-job staging || true
      - name: The regression's result
        env:
          STAGING: ${{ needs.staging.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "deploy and Apex: $STAGING; UI shards: $UI"
          [ "$STAGING" = success ] && { [ "$UI" = success ] || [ "$UI" = skipped ]; }
  nudge:
    # Separate job: the write permissions never sit next to the release branch's code. Runs after a failed regression
    # too, so the release card says it failed and offers a fix.
    needs: [staging, regression]
    if: always() && needs.regression.result != 'skipped' && needs.regression.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write        # re-runs the gate if the release PR is already approved
      contents: read
      checks: read
      issues: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REL: ${{ needs.staging.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Ship now if the release PR is already approved
        run: |
          RPR=$(gh pr list --head "$REL" --base main --state open --json number --jq '.[0].number // empty')
          [ -z "$RPR" ] || node pipeline/bin/pipe.mjs gate nudge "$RPR"   # also refreshes the release card
          # UAT_ENABLED: UAT when staging passed on the release PR's head and UAT does not have it yet (journey.mjs);
          # a superseded or skipped run changes nothing, and the release PR opening later asks the same question
          [ -z "$RPR" ] || node pipeline/bin/pipe.mjs next --after staging --pr "$RPR"
