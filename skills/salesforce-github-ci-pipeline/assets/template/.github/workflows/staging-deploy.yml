name: staging-deploy
# After a story merges into the release branch (started by the gate): deploy the whole release branch to the
# staging org and run its tests: a story merge, the tests for what changed since the last tested commit; the release
# PR, every Apex and Flow test (and the UI regression). The job name is the "staging regression" check the gate needs.
# Pipeline code comes from main (.pipeline/); the release branch's own specs run only after production access is gone.
on:
  workflow_dispatch:
permissions:
  contents: read
# One run at a time per release branch, and one waiting: a merge during a regression queues without a runner, and a
# newer merge replaces it (GitHub cancels the older pending run), so a burst of merges costs two runs, not one each.
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  staging:
    name: staging regression
    runs-on: ubuntu-latest
    permissions:
      actions: read         # the org lane checks whether the holder's run has ended (lane.mjs)
      contents: write       # the staging org's lane only (a ref under refs/locks/); the specs never see a token
      checks: write         # the live "Salesforce tests" check on the release head
      pull-requests: read   # the release PR: is it open, and its standing (the UI regression is due once it is)
      statuses: read        # has the UI regression already passed on this code (the gate's own reading)
      issues: read          # the release PR's facts (gate.gather reads its events and comments)
    timeout-minutes: 75   # 45 of them may be waiting for the staging org's lane (release-PR CI, a back-merge)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      release: ${{ steps.ctx.outputs.RELEASE_BRANCH }}
      ui: ${{ steps.uirun.outcome }}   # the UI regression: success, failure, or skipped (not due, or already passed)
      ui-planned: ${{ steps.fresh.outputs.ui }}   # run: it was due, so a skipped outcome means its setup failed
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\nbaseline-facts\ndata/seed\ndocs/agents\ne2e/support\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - name: The open sprint
        id: ctx
        working-directory: .pipeline
        run: |
          node pipeline/bin/pipe.mjs context
          node pipeline/bin/pipe.mjs context | grep -q '^RELEASE_BRANCH=.' || { echo "::error::No open sprint"; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", path: candidate, fetch-depth: 20, persist-credentials: false }   # exactly the commit this run is for (and the ones before it: #237)
      - name: What this run does (nothing when a newer merge superseded it; Apex unless passed on this code; the UI regression once per release, UI_REGRESSION)
        id: fresh
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs ci staging-plan --branch "${{ steps.ctx.outputs.RELEASE_BRANCH }}"
      - name: Wait for the staging org's lane (nobody is dropped)
        if: steps.fresh.outputs.done != 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs lane acquire "sprint:${{ steps.ctx.outputs.SPRINT }}"
      - uses: ./.pipeline/.github/actions/sf-auth
        if: steps.fresh.outputs.done != 'true'
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Deploy the release branch to staging and prepare it
        if: steps.fresh.outputs.done != 'true'
        working-directory: candidate
        run: |
          node ../.pipeline/pipeline/bin/pipe.mjs org ready "sprint:${{ steps.ctx.outputs.SPRINT }}"   # this candidate, deployed and prepared
      - name: Regression (every Apex and Flow test for the release; a story merge's own tests otherwise), live on the release head as "Salesforce tests"
        if: steps.fresh.outputs.apex == 'run'
        working-directory: candidate
        env:
          TESTS: ${{ steps.fresh.outputs.tests }}   # a story merge: --base <last tested>; the release PR (or nothing tested yet): --all (stagingPlan)
        run: node ../.pipeline/pipeline/bin/pipe.mjs tests run staging $TESTS --sha "$(git rev-parse HEAD)" --out test-results
      - name: Drop production access before running the branch's specs
        if: steps.fresh.outputs.ui == 'run'
        run: |
          # loginAs reads these: once the Dev Hub is logged out, `sf org display` fails
          sf org display -o staging --json | jq -r '.result | "SCRATCH_ORG_ID=\(.id)\nSCRATCH_INSTANCE_URL=\(.instanceUrl)"' >> "$GITHUB_ENV"
          sf org logout -o devhub --no-prompt >/dev/null 2>&1 || true
          rm -f "${SF_CI_KEY_FILE:-}"
      - name: The test harness from main (login, personas, evidence), not the release branch's copy
        if: steps.fresh.outputs.ui == 'run'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs harness overlay staging --from ../.pipeline
      - uses: ./.pipeline/.github/actions/playwright
        if: steps.fresh.outputs.ui == 'run' && hashFiles('candidate/e2e/*.spec.ts') != ''
        env:
          GH_TOKEN: ""          # installs the branch's packages: no token
        with: { working-directory: candidate }
      - name: UI regression (every spec in e2e/)
        id: uirun
        if: steps.fresh.outputs.ui == 'run'
        working-directory: candidate
        env:
          GH_TOKEN: ""
        run: |
          if ls e2e/*.spec.ts >/dev/null 2>&1; then
            SCRATCH_ALIAS=staging npx playwright test
          else
            echo "No UI specs yet"
          fi
      - name: Let the next job into the staging org's lane (not after the UI regression, see below)
        # After the UI regression the lane stays held until this run ends (the holder is then stale, lane.mjs): the
        # nudge job records pipeline/ui-regression first, so a queued run reads the result instead of repeating the
        # suite (code review, 14 Oct).
        if: always() && steps.fresh.outputs.ui != 'run'
        working-directory: .pipeline
        run: node pipeline/bin/pipe.mjs lane release "sprint:${{ steps.ctx.outputs.SPRINT }}" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.fresh.outputs.done != 'true'
        with:
          name: staging-results
          # failures only need the log and the report; never a trace (it holds the org's session: playwright.config.ts)
          retention-days: 14
          path: |
            candidate/test-results
            candidate/playwright-report
            !candidate/**/trace.zip
            !candidate/**/*.webm
            !candidate/playwright-report/data/*.zip
  nudge:
    # Separate job: the write permissions never sit next to the release branch's code. Runs after a failed regression
    # too, so the release card says it failed and offers a fix.
    needs: staging
    if: always() && needs.staging.result != 'skipped' && needs.staging.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write        # re-runs the gate if the release PR is already approved
      contents: read
      checks: read
      issues: write
      pull-requests: write
      statuses: write       # pipeline/ui-regression on the commit the staging job tested
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REL: ${{ needs.staging.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # One step ends the stage (pipe finish, finish.mjs): the UI regression as pipeline/ui-regression on the commit
      # tested (planned but not run, its setup or the deploy failing first, is a failure, so nothing waits on it); then,
      # on the open release PR, the gate if it is approved, the release card, and what the journey owes (UAT when
      # staging passed on its head and UAT does not have it; a superseded or skipped run changes nothing)
      - name: The UI regression's verdict, then the gate, the card and what comes next
        run: |
          node pipeline/bin/pipe.mjs finish staging --branch "$REL" --sha "$GITHUB_SHA" --outcome "${{ needs.staging.outputs.ui }}" \
            $([ "${{ needs.staging.outputs.ui-planned }}" = run ] && echo --planned)
