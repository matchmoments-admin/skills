name: staging-deploy
# After a story merges into the release branch (started by the gate): deploy the whole release branch to the
# staging org and run the full regression. The job name is the "staging regression" check the release gate needs.
# Pipeline code comes from main (.pipeline/); the release branch's own specs run only after production access is gone.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
jobs:
  staging:
    name: staging regression
    runs-on: ubuntu-latest
    permissions:
      actions: read         # the org lane checks whether the holder's run has ended (lane.mjs)
      contents: write       # the staging org's lane only (a ref under refs/locks/); the specs never see a token
      checks: write         # the live "Salesforce tests" check on the release head
      pull-requests: read   # is the release PR open (the UI regression is due once it is)
      statuses: read        # has the UI regression already passed on this code
    timeout-minutes: 75   # 45 of them may be waiting for the staging org's lane (release-PR CI, a back-merge)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      release: ${{ steps.ctx.outputs.RELEASE_BRANCH }}
      ui: ${{ steps.uirun.outcome }}   # the UI regression: success, failure, or skipped (not due, or already passed)
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\ndata/seed\ndocs/agents\ne2e/support\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - name: The open sprint
        id: ctx
        working-directory: .pipeline
        run: |
          node pipeline/bin/pipe.mjs context
          node pipeline/bin/pipe.mjs context | grep -q '^RELEASE_BRANCH=.' || { echo "::error::No open sprint"; exit 1; }
      - name: Still the release branch's tip? (each merge queues a run; only the newest needs to test)
        id: current
        run: |
          TIP=$(gh api "repos/$GH_REPO/commits/${{ steps.ctx.outputs.RELEASE_BRANCH }}" --jq .sha)
          if [ "$TIP" != "$GITHUB_SHA" ]; then echo "superseded=true" >> "$GITHUB_OUTPUT"; echo "superseded by ${TIP:0:7}: its own run tests it"; fi
      - name: Wait for the staging org's lane (nobody is dropped)
        if: steps.current.outputs.superseded != 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs lane acquire "sprint:${{ steps.ctx.outputs.SPRINT }}"
      - uses: actions/checkout@v4
        if: steps.current.outputs.superseded != 'true'
        with: { ref: "${{ github.sha }}", path: candidate, fetch-depth: 20, persist-credentials: false }   # exactly the commit this run is for (and the ones before it: #237)
      - name: What this run does (Apex unless passed on this code; the UI regression once per release, UI_REGRESSION)
        id: fresh
        if: steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs ci staging-plan --branch "${{ steps.ctx.outputs.RELEASE_BRANCH }}"
      - uses: ./.pipeline/.github/actions/sf-auth
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Deploy the release branch to staging and prepare it
        if: steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: |
          node ../.pipeline/pipeline/bin/pipe.mjs org ready "sprint:${{ steps.ctx.outputs.SPRINT }}"   # this candidate, deployed and prepared
      - name: Full regression (every Apex and Flow test), live on the release head as "Salesforce tests"
        if: steps.fresh.outputs.apex == 'run' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs tests run staging --all --base HEAD --sha "$(git rev-parse HEAD)" --out test-results
      - name: Drop production access before running the branch's specs
        if: steps.fresh.outputs.ui == 'run' && steps.current.outputs.superseded != 'true'
        run: |
          # loginAs reads these: once the Dev Hub is logged out, `sf org display` fails
          sf org display -o staging --json | jq -r '.result | "SCRATCH_ORG_ID=\(.id)\nSCRATCH_INSTANCE_URL=\(.instanceUrl)"' >> "$GITHUB_ENV"
          sf org logout -o devhub --no-prompt >/dev/null 2>&1 || true
          rm -f "${SF_CI_KEY_FILE:-}"
      - name: The test harness from main (login, personas, evidence), not the release branch's copy
        if: steps.fresh.outputs.ui == 'run' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        run: node ../.pipeline/pipeline/bin/pipe.mjs harness overlay staging --from ../.pipeline
      - uses: ./.pipeline/.github/actions/playwright
        if: steps.fresh.outputs.ui == 'run' && steps.current.outputs.superseded != 'true' && hashFiles('candidate/e2e/*.spec.ts') != ''
        env:
          GH_TOKEN: ""          # installs the branch's packages: no token
        with: { working-directory: candidate }
      - name: UI regression (every spec in e2e/)
        id: uirun
        if: steps.fresh.outputs.ui == 'run' && steps.current.outputs.superseded != 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ""
        run: |
          if ls e2e/*.spec.ts >/dev/null 2>&1; then
            SCRATCH_ALIAS=staging npx playwright test
          else
            echo "No UI specs yet"
          fi
      - name: Let the next job into the staging org's lane
        if: always() && steps.current.outputs.superseded != 'true'
        working-directory: .pipeline
        run: node pipeline/bin/pipe.mjs lane release "sprint:${{ steps.ctx.outputs.SPRINT }}" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.fresh.outputs.done != 'true' && steps.current.outputs.superseded != 'true'
        with:
          name: staging-results
          path: |
            candidate/test-results
            candidate/playwright-report
            !candidate/**/trace.zip
            !candidate/**/*.webm
  nudge:
    # Separate job: the write permissions never sit next to the release branch's code. Runs after a failed regression
    # too, so the release card says it failed and offers a fix.
    needs: staging
    if: always() && needs.staging.result != 'skipped' && needs.staging.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write        # re-runs the gate if the release PR is already approved
      contents: read
      checks: read
      issues: write
      pull-requests: write
      statuses: write       # pipeline/ui-regression on the commit the staging job tested
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REL: ${{ needs.staging.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Record the UI regression on this commit (the release gate needs it once per release)
        if: needs.staging.outputs.ui == 'success' || needs.staging.outputs.ui == 'failure'
        run: |
          if [ "${{ needs.staging.outputs.ui }}" = success ]; then S=success; D="every UI spec passed on the staging org"; else S=failure; D="a UI spec failed on the staging org"; fi
          node pipeline/bin/pipe.mjs status set pipeline/ui-regression "$S" "$GITHUB_SHA" "$D"
      - name: Ship now if the release PR is already approved
        run: |
          RPR=$(gh pr list --head "$REL" --base main --state open --json number --jq '.[0].number // empty')
          [ -z "$RPR" ] || node pipeline/bin/pipe.mjs gate nudge "$RPR"   # also refreshes the release card
          # UAT_ENABLED: UAT when staging passed on the release PR's head and UAT does not have it yet (journey.mjs);
          # a superseded or skipped run changes nothing, and the release PR opening later asks the same question
          [ -z "$RPR" ] || node pipeline/bin/pipe.mjs next --after staging --pr "$RPR"
