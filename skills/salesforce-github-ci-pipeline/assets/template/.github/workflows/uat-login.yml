name: uat-login
# BUTTONS: "Send me a login" / "Send me an admin login" on a story (issue or PR: the story's scratch org) and "Send me a UAT login" on the release card (the UAT stand-in scratch org; a real UAT sandbox uses people's own
# sandbox logins). Makes the person a tester in the UAT org (Standard User + the release's permission sets) and has
# Salesforce email them a link to set a password: no password or session is ever in GitHub. Their address comes from
# the repository variable UAT_TESTERS ({"github-login": "email"}), else their public GitHub email.
run-name: "${{ format('login @{0} to {1} (PR #{2})', inputs.who, inputs.target || 'UAT', inputs.pr) }}"
on:
  workflow_dispatch:
    inputs:
      pr: { description: "The issue or pull request the request came from (the reply goes there)", required: true }
      who: { description: GitHub login of the tester, required: true }
      target: { description: "A story branch (its scratch org); empty = the release's UAT org", required: false, default: "" }
      admin: { description: "'true': a System Administrator login (to build in Setup), not the story's persona", required: false, default: "false" }
permissions:
  contents: write       # the event log
  pull-requests: write
  issues: write
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  login:
    if: vars.UAT_ENABLED == 'true' || inputs.target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      WHO: ${{ inputs.who }}
    steps:
      - name: The release PR, and the tester's email
        id: who
        env:
          TESTERS: ${{ vars.UAT_TESTERS }}
          SANDBOX: ${{ secrets.SF_UAT_USERNAME != '' }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ && "$WHO" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::bad input"; exit 1; }
          if [ "$SANDBOX" = true ] && [ -z "${{ inputs.target }}" ]; then gh issue comment "$PR" --body "@$WHO: UAT is a sandbox here: log in with your sandbox account (ask an admin for one)."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          EMAIL=$(jq -r --arg w "$WHO" '.[$w] // empty' <<<"${TESTERS:-{\}}" 2>/dev/null || true)
          [ -n "$EMAIL" ] || EMAIL=$(gh api "users/$WHO" --jq '.email // empty')
          if [ -z "$EMAIL" ]; then
            gh issue comment "$PR" --body "@$WHO: I need an email to send your UAT login to. Ask an admin to add you to the repository variable \`UAT_TESTERS\` (\`{\"$WHO\": \"you@company.com\"}\`), or make your GitHub email public, then tick the box again."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$EMAIL"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          [ -n "${{ inputs.target }}" ] || echo "sprint=$(gh pr view "$PR" --json headRefName --jq '.headRefName | sub("^release/"; "")')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.who.outputs.skip != 'true'
        with: { ref: main }
      - uses: ./.github/actions/sf-auth
        if: steps.who.outputs.skip != 'true'
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: The tester, and Salesforce's email to them
        if: steps.who.outputs.skip != 'true'
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}   # TRACKER=jira: this step's pipe command uses the tracker
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          EMAIL: ${{ steps.who.outputs.email }}
          SPRINT: ${{ steps.who.outputs.sprint }}
        run: |
          TARGET="${{ inputs.target }}"
          if [ -n "$TARGET" ]; then [[ "$TARGET" =~ ^(issue-[0-9]+|[A-Z][A-Z0-9]+-[0-9]+)$ ]] || { echo "::error::not a story branch"; exit 1; }
            if ! ALIAS=$(node pipeline/bin/pipe.mjs org attach "$TARGET"); then
              # FREE_IDLE_ORGS gave its org to a waiting story: start it again from the branch (issue-start), then the login
              [ -n "$(gh pr list --head "$TARGET" --label org:released --json number --jq '.[0].number // empty')" ] || exit 1
              gh api "repos/$GH_REPO/dispatches" -f event_type=jira-start -f "client_payload[key]=${TARGET#issue-}" >/dev/null
              gh issue comment "$PR" --body "@$WHO: this story's scratch org was freed while it waited for approval. It is being made again from the branch (about 5 minutes, or when a slot frees up: the story card says which). Then tick **Send me a login** again."
              exit 0
            fi
          else node pipeline/bin/pipe.mjs org attach "uat:$SPRINT" >/dev/null; ALIAS=uat; fi
          ADMIN=(); [ "${{ inputs.admin }}" = true ] && ADMIN=(--admin)
          node pipeline/bin/pipe.mjs uat tester --pr "$PR" --login "$WHO" --email "$EMAIL" --alias "$ALIAS" "${ADMIN[@]}"
