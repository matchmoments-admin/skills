name: snapshot-refresh
# The scratch-org snapshot new orgs start from (org.mjs create/currentSnapshot): production's shape, the managed
# packages, the production baseline, main's source and the seed data, already deployed. Its description names what it
# holds: b<baseline id> s<seed id> h<shape inputs id> (Settings metadata and the scratch definition). Rebuilt (#430):
# - when the baseline or the seed changes on main (a push), unless the newest snapshot, or one still being made,
#   already holds them; a push that also changes the shape inputs waits for the release (next line);
# - after a release (release.yml, after its shape job), only if the release changed the shape inputs: a release of
#   code alone keeps it (about 16 billed minutes saved), and new orgs deploy main's force-app on top of it anyway;
#   a release that changed production's customisations comes back as the baseline PR, whose merge is a push;
# - weekly (org-shape-refresh: production's shape and Salesforce's seasonal upgrades), and by hand (empty inputs: always).
# Never while SCRATCH_SNAPSHOT pins a snapshot (nothing would use the new one).
# Costs one daily scratch org and one active slot while it builds; the newest Active snapshot is used automatically,
# and only the newest two are kept. A snapshot that is not Active yet is not used: orgs keep the previous one.
on:
  workflow_dispatch:
    inputs:
      if-older-than: { description: "Rebuild only if the newest snapshot is older than this many hours (empty: always)", required: false, default: "" }
      if-changed: { description: "Rebuild only if the newest snapshot lacks main's baseline, seed or shape inputs", type: boolean, required: false, default: false }
  push:
    branches: [main]
    paths: ["baseline/**", "data/seed/**"]
concurrency:
  group: snapshot-refresh
  cancel-in-progress: false
permissions:
  contents: write   # the event log
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  build:
    if: vars.SCRATCH_SNAPSHOT != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # snapshots can take an hour or more to become Active
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: ./.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Build the source org and snapshot it
        env:
          OLDER: ${{ inputs.if-older-than }}
          # a push: only what changed (and a change of the shape inputs waits for the release's shape job: pipe defers it)
          CHANGED: ${{ github.event_name == 'push' && '--if-changed --on-push' || inputs.if-changed && '--if-changed' || '' }}
        run: node pipeline/bin/pipe.mjs snapshot refresh --minutes 100 ${OLDER:+--if-older-than "$OLDER"} $CHANGED
      - name: A failed build never leaves the source org holding a slot (a pending snapshot keeps it; it lives a day)
        if: failure()
        run: node pipeline/bin/pipe.mjs org remove snapshot || true
