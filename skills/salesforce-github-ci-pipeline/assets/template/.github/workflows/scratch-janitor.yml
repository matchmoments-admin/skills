name: scratch-janitor
# Every 6 hours: delete orphan scratch orgs (CI orgs whose run died, closed stories, staging and UAT of sprints no longer
# open) through the Dev Hub, and report the allocation. Run by hand any time. The GitHub-only sweeps (reconcile, the
# release watchdog, the evidence branch) are reconcile.yml's, hourly and without the Dev Hub key.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: an orphan must not hold one of the Dev Hub's slots long, and a stalled PR waits one tick
  workflow_dispatch:
permissions:
  contents: write       # the event log (orgs deleted); which sprint is open
  issues: write         # which stories are closed; a freed slot restarts a story waiting for an org (its labels)
  actions: write        # a freed slot starts what waited for it (journey.mjs)
  pull-requests: write  # a freed slot: is a release PR waiting for UAT (journey.mjs); labels and cards
  checks: read
  statuses: write       # a UI test a freed slot starts is pending on the head first (start.startJob)
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}           # TRACKER=jira: the tracker's login (empty when unset); JIRA_BASE_URL is a setting
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
jobs:
  sweep:
    runs-on: ubuntu-latest
    concurrency:
      group: scratch-orgs   # deletes orgs
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }   # pipeline code from main
      - uses: ./.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - run: |
          node pipeline/bin/pipe.mjs org sweep
          node pipeline/bin/pipe.mjs org pool    # ORG_POOL warm orgs (0: none), only while a slot stays free
          node pipeline/bin/pipe.mjs org limits
