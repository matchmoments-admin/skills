name: scratch-janitor
# Every 6 hours: delete orphan scratch orgs (CI orgs whose run died, closed stories, staging and UAT of sprints no longer
# open) through the Dev Hub, and report the allocation. Run by hand any time.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours: an orphan must not hold one of the Dev Hub's active slots for long
  workflow_dispatch:
permissions:
  contents: read        # which sprint is open (release branch refs)
  issues: read          # which stories are closed
jobs:
  sweep:
    runs-on: ubuntu-latest
    concurrency:
      group: scratch-orgs   # deletes orgs
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # pipeline code from main, whatever ref this was started on
      - uses: ./.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - run: |
          node pipeline/bin/pipe.mjs org sweep
          node pipeline/bin/pipe.mjs org limits
