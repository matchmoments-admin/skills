name: org-shape-refresh
# Re-captures production's org shape (edition, features, settings) so new scratch orgs match production.
# Also runs after every production release (release.yml). Weekly catches Setup changes made by hand
# and Salesforce's seasonal upgrades. Layouts, code and other metadata are not part of the shape: they come from git.
on:
  schedule:
    - cron: "0 20 * * 0"     # Sunday 20:00 UTC (Monday morning AEST)
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # starts the weekly production baseline and snapshot rebuild
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # pipeline code from main, whatever ref this was started on
      - uses: ./.github/actions/sf-auth
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Capture production's shape
        run: |
          sf org create shape -o devhub
          sf org list shape
      - name: Then the production baseline and the snapshot (weekly; Salesforce's seasonal upgrades included)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prod-baseline.yml --ref main -f reason="weekly" || echo "::warning::could not start prod-baseline"
          gh workflow run snapshot-refresh.yml --ref main -f if-older-than=20 || echo "::warning::could not start snapshot-refresh"
