name: data-seed
# Test data on request for a Developer sandbox (Actions > data-seed > Run workflow): type what you need
# ("Account 20; Contact 2 per Account; Case 5 Status=Escalated") or name a committed request file, pick the sandbox, and
# the records are generated to fit that sandbox's own schema, shaped like production (the Data profile, read on demand,
# never saved), and tracked by a Data ledger in the sandbox: running it again with the same request does nothing, a
# changed one replaces only its own records, `refresh` loads what the sandbox holds again so it follows production's shape
# today (a new picklist value, a changed mix; scope `all`: every set), and `remove` takes them out again. Records people made stay.
# The sandbox is logged in as the CI user's sandbox copy (<SF_CI_USERNAME>.<sandbox>, the same certificate: sandboxes
# copy the connected app and its users). Production and the Dev Hub are refused by the loader itself. Agent-free.
run-name: "test data: ${{ inputs.action }} in sandbox ${{ inputs.sandbox }}"
on:
  workflow_dispatch:
    inputs:
      sandbox: { description: "Sandbox name (the suffix of its usernames, e.g. dev1)", required: true }
      action: { description: "seed: load the request · refresh: load the set again, shaped like production today · status: what the sandbox holds · remove: take it out again", type: choice, options: [seed, refresh, status, remove], default: seed }
      data: { description: "What to load, typed: Account 20; Contact 2 per Account; Case 5 Status=Escalated (or leave empty and give a request file)", required: false, default: "" }
      request: { description: "Or a committed request file, e.g. data/seed/stories/512/request.json", required: false, default: "" }
      scope: { description: "The set's name in the sandbox (another seed with the same name replaces it; refresh: all for every set)", required: false, default: "by hand" }
permissions:
  contents: write         # the event log
concurrency:
  group: data-seed-${{ inputs.sandbox }}
  cancel-in-progress: false
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}
defaults:
  run:
    shell: bash   # with pipefail: `pipe ... | tee` fails when pipe does
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SANDBOX: ${{ inputs.sandbox }}
      ACTION: ${{ inputs.action }}
      DATA: ${{ inputs.data }}
      REQUEST: ${{ inputs.request }}
      SCOPE: ${{ inputs.scope }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SANDBOX" =~ ^[A-Za-z][A-Za-z0-9]{0,9}$ ]] || { echo "::error::'$SANDBOX' is not a sandbox name (letters and digits, up to 10)"; exit 1; }
          [[ -z "$REQUEST" || "$REQUEST" =~ ^[A-Za-z0-9_./-]+\.json$ ]] || { echo "::error::request must be a .json path in the repo"; exit 1; }
          if [ "$ACTION" = seed ] && [ -z "$DATA" ] && [ -z "$REQUEST" ]; then echo "::error::say what to load: type it in 'data' (Account 20; Contact 2 per Account), or give a 'request' file"; exit 1; fi
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/sf-auth   # the Dev Hub (production): read only, for the profile
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: Log in to the sandbox as the CI user's sandbox copy
        env:
          CI_USER: ${{ secrets.SF_CI_USERNAME }}
          CLIENT_ID: ${{ secrets.SF_CI_CONSUMER_KEY }}
        run: |
          sf org login jwt --client-id "$CLIENT_ID" --jwt-key-file "$SF_CI_KEY_FILE" --username "$CI_USER.$SANDBOX" --instance-url https://test.salesforce.com --alias "sandbox-$SANDBOX" >/dev/null \
            || { echo "::error::could not log in to sandbox '$SANDBOX' as $CI_USER.$SANDBOX: check the name, and that the sandbox was created or refreshed after the CI connected app existed"; exit 1; }
      - name: Test data
        run: |
          ORG="sandbox-$SANDBOX"
          set +e   # the summary says what happened either way; the step then fails if pipe did
          case "$ACTION" in
            seed)
              if [ -n "$DATA" ]; then node pipeline/bin/pipe.mjs data seed --org "$ORG" --data "$DATA" --scope "$SCOPE" 2>&1 | tee "$RUNNER_TEMP/out.txt"
              else node pipeline/bin/pipe.mjs data seed --org "$ORG" --request "$REQUEST" --scope "$SCOPE" 2>&1 | tee "$RUNNER_TEMP/out.txt"; fi ;;
            refresh)
              if [ "$SCOPE" = all ]; then node pipeline/bin/pipe.mjs data refresh --org "$ORG" 2>&1 | tee "$RUNNER_TEMP/out.txt"
              else node pipeline/bin/pipe.mjs data refresh --org "$ORG" --scope "$SCOPE" 2>&1 | tee "$RUNNER_TEMP/out.txt"; fi ;;
            status) node pipeline/bin/pipe.mjs data status --org "$ORG" --scope "$SCOPE" 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
            remove) node pipeline/bin/pipe.mjs data remove --org "$ORG" --scope "$SCOPE" 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
          esac
          status=$?
          { echo "### Test data in sandbox \`$SANDBOX\` ($ACTION, set \"$SCOPE\"): $([ $status = 0 ] && echo done || echo "**failed**")"; echo; sed 's/^::error:://; s/^/> /' "$RUNNER_TEMP/out.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
