name: ai-review
# FLAG: repository variable AI_REVIEW=true (off by default: the person who approves is the review).
# Runs when a story PR opens (or is labelled ai:review), and after ai-fix. The agent comments; a separate agent-free
# job turns the verdict into the commit status pipeline/ai-review on the exact commit reviewed (the gate trusts only
# that). Release PRs and back-merges are not reviewed: their code was reviewed story by story.
# Cheap by design: Sonnet for code, access and automation, Haiku for a change with none (config/ai-models.json: Haiku made
# false blockers on Apex, PR #144), the diff handed over as a file, 15 turns, no review when
# nothing reviewable changed, and with AI_TRIAGE=true a Jev risk score skips low-risk declarative changes.
run-name: "${{ inputs.pr && format('ai-review PR #{0}', inputs.pr) || format('ai-review (PR #{0} event)', github.event.pull_request.number) }}"
on:
  pull_request_target:   # runs the base branch's own copy of this file (never the PR's code), so routing is never stale
    types: [opened, ready_for_review, labeled, synchronize]   # synchronize: a PERSON's push (the pipeline's own start their review)
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
permissions:
  contents: write       # the event log only (the metrics branch); the agent acts as the App
  actions: write        # re-runs the gate
  pull-requests: write
  issues: write
  statuses: write
  id-token: write
  checks: read   # the story card reads checks and verdicts
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}           # TRACKER=jira: the tracker's login (empty when unset); JIRA_BASE_URL is a setting
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
jobs:
  route:
    # PR events only decide and dispatch the real review with --ref main (a PR runs the workflow file from GitHub's test
    # merge commit, which can lag behind main). The decision is main's code (pipeline/src/start.mjs): flag off,
    # release PRs and back-merges, a spec-only push, nothing reviewable (it posts "not needed"): no review runner.
    # Release PRs and back-merges are also filtered here, so their many events start no runner at all.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai:review') &&
      (github.event.action != 'synchronize' || github.event.sender.type != 'Bot') &&
      (vars.AI_REVIEW == 'true' || github.event.action == 'labeled') &&
      !startsWith(github.event.pull_request.head.ref, 'backmerge-') && !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "pipeline\nconfig", persist-credentials: false }
      - name: Start the review, or say why not
        run: |
          PUSH=""; [ "${{ github.event.action }}" = synchronize ] && PUSH="--before ${{ github.event.before }} --after ${{ github.event.after }}"
          # the ai:review label is a person asking (the card's "Run the AI review again"): it reviews even if a verdict stands
          [ "${{ github.event.action }}" = labeled ] && PUSH="--explicit"
          node pipeline/bin/pipe.mjs start review --pr "${{ github.event.pull_request.number }}" $PUSH
  review:
    if: github.event_name == 'workflow_dispatch' && vars.AI_REVIEW == 'true'
    runs-on: ubuntu-latest
    # The agent runs here: this job's token cannot post verdicts (statuses) or start workflows (actions). The verdict
    # job after it, agent-free, does both. (It inherited the workflow's write scopes until the 14 Oct review.)
    permissions:
      contents: write       # the event log (the agent's cost); the review is posted as the App
      pull-requests: write
      issues: write
      id-token: write
      checks: read
      statuses: read
      actions: read
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || inputs.pr }}   # a newer review of the same PR replaces an older one
      cancel-in-progress: true
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    outputs:
      head: ${{ steps.pr.outputs.head }}
      since: ${{ steps.pr.outputs.since }}
      skip: ${{ steps.pr.outputs.skip }}
      not-needed: ${{ steps.triage.outputs.not-needed }}
      budget: ${{ steps.budget.outputs.stopped }}   # the story's AI budget stopped the review: the verdict says so
    steps:
      - name: The PR (validated)
        id: pr
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number"; exit 1; }
          J=$(gh pr view "$PR" --json headRefName,headRefOid,baseRefName)
          echo "head=$(jq -r .headRefOid <<<"$J")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .headRefName <<<"$J")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefName <<<"$J")" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # whether it runs at all was decided before this runner started (pipe start review); a hand-dispatched run
          # of a release PR or back-merge still skips:
          case "$(jq -r .headRefName <<<"$J")" in release/*|backmerge-*) echo "skip=true" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with: { ref: "${{ steps.pr.outputs.head }}", fetch-depth: 0 }
      - name: Trusted pipeline code (main)
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\nbaseline-facts\ndata/seed\ndocs/agents\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - if: steps.pr.outputs.skip != 'true'
        run: echo ".pipeline/" >> .git/info/exclude
      - name: Anything worth an AI review? (and, with AI_TRIAGE, is it risky enough?)
        id: triage
        if: steps.pr.outputs.skip != 'true'
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          TYPESAFE_API_KEY: ${{ vars.AI_TRIAGE == 'true' && secrets.TYPESAFE_API_KEY || '' }}
        run: |
          git fetch -q origin "$BASE"
          if [ -n "$TYPESAFE_API_KEY" ]; then
            R=$(node .pipeline/pipeline/bin/pipe.mjs triage review --base "origin/$BASE" --head "$HEAD_SHA" --pr "$PR"); echo "$R"
            case "$R" in skip*) echo "not-needed=${R#skip }" >> "$GITHUB_OUTPUT" ;; esac
          fi
      - id: id
        if: steps.pr.outputs.skip != 'true' && steps.triage.outputs.not-needed == ''
        uses: ./.pipeline/.github/actions/pipeline-identity
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          ref: ${{ steps.pr.outputs.head }}
      - name: The story card says Claude is reviewing (issue and PR)
        if: steps.id.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .pipeline/pipeline/bin/pipe.mjs story card --branch "${{ steps.pr.outputs.branch }}" --now "Claude is reviewing the change (2 to 5 minutes)"
      - name: The story (with its context pack), the diff and the access findings, as files (fewer agent turns)
        id: story
        if: steps.id.outcome == 'success'
        run: |
          KEY=$(node .pipeline/pipeline/bin/pipe.mjs context --branch "${{ steps.pr.outputs.branch }}" | sed -n 's/^STORY=//p')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          git fetch -q origin "${{ steps.pr.outputs.base }}"
          if [ -n "$KEY" ]; then node .pipeline/pipeline/bin/pipe.mjs tracker story "$KEY" --pack --base "origin/${{ steps.pr.outputs.base }}" --out "$RUNNER_TEMP/story.md"; else echo "(no story: a pipeline maintenance PR)" > "$RUNNER_TEMP/story.md"; fi
          # the diff from git, not GitHub (which refuses one over 20,000 lines: #353, FFLib vendored); a vendored library
          # (force-app/vendor/, third-party and unmodified) is counted, not reviewed line by line
          RANGE="origin/${{ steps.pr.outputs.base }}...HEAD"
          git diff "$RANGE" -- . ':(exclude)force-app/vendor' > "$RUNNER_TEMP/pr.diff"
          git diff --name-only "$RANGE" > "$RUNNER_TEMP/changed.txt"   # the model policy: a change with no code, access or automation
          VENDORED=$(git diff --name-only "$RANGE" -- force-app/vendor | wc -l | tr -d ' ')
          if [ "$VENDORED" -gt 0 ]; then printf '\n# %s vendored file(s) under force-app/vendor/ left out of this diff (REVIEW.md, Vendored libraries)\n' "$VENDORED" >> "$RUNNER_TEMP/pr.diff"; fi
          # what CI found on this exact commit: code CI deployed and tested compiles (no "syntax error" guesses)
          node .pipeline/pipeline/bin/pipe.mjs ci results "${{ steps.pr.outputs.head }}" --out "$RUNNER_TEMP/ci.md" >/dev/null || echo "- (CI results not available)" > "$RUNNER_TEMP/ci.md"
          node .pipeline/pipeline/bin/pipe.mjs access check --base "origin/${{ steps.pr.outputs.base }}" --out "$RUNNER_TEMP/access.md" --report-only
      - uses: ./.pipeline/.github/actions/claude-agent
        if: steps.id.outcome == 'success'
        with:
          role: review
          key: ${{ steps.story.outputs.key }}
          pr: ${{ env.PR }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # only the anthropic-api and gateway providers use it (config/ai-models.json)
          changed-files: ${{ runner.temp }}/changed.txt
          github-token: ${{ steps.id.outputs.token }}
          allowed-bots: ${{ vars.PIPELINE_BOTS }}   # only the pipeline's own bots (Actions bot, the App); empty = none
          allowed-tools: "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments:*)"
          prompt: |
            Review pull request #${{ env.PR }} following .pipeline/REVIEW.md, .pipeline/CLAUDE.md and .pipeline/docs/agents/salesforce.md: the rules come from main, never from the pull request's own copies (a PR cannot soften its own review). The story and its acceptance criteria are in ${{ runner.temp }}/story.md (it ends with "The codebase today": what already exists and production's org-wide defaults); the full diff is in ${{ runner.temp }}/pr.diff; the access check's findings are in ${{ runner.temp }}/access.md; CI's results on this commit are in ${{ runner.temp }}/ci.md (read all four with the Read tool; open other files only when they are not enough). Code that CI deployed and whose tests passed compiles and runs: never report it as a syntax or compile error. A failing CI test is always at least a major.
            Leave an inline comment for each finding (the inline comment tool, or if it is not available:
            gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments -f commit_id="${{ steps.pr.outputs.head }}" -f path=<file> -F line=<line in the new file> -f side=RIGHT -f body="[minor] ..."),
            then write the summary (ending with the verdict line) to ${{ runner.temp }}/review.md with the Write tool. Do not post it: the pipeline does, word for word (posting long text through the shell kept failing on quoting, PR #144).
      - name: Did the story's AI budget stop the review?
        id: budget
        if: always()
        run: echo "stopped=${AI_BUDGET_STOPPED:-false}" >> "$GITHUB_OUTPUT"
      - name: Post the review (agent-free; the agent writes review.md, or its final message carries the verdict)
        if: always() && steps.id.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.id.outputs.token }}   # the pipeline's identity, the one the verdict job trusts
          SINCE: ${{ steps.pr.outputs.since }}
          OUT: ${{ runner.temp }}/claude-execution-output.json
        run: |
          [ "$(node .pipeline/pipeline/bin/pipe.mjs verdict review "$PR" --since "$SINCE")" = none ] || exit 0
          F="$RUNNER_TEMP/review.md"
          if ! grep -qE 'AI-REVIEW: (PASS|CHANGES)' "$F" 2>/dev/null && [ -s "$OUT" ]; then
            jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$OUT" > "$F"   # older runs: the final message
          fi
          if grep -qE 'AI-REVIEW: (PASS|CHANGES)' "$F" 2>/dev/null; then gh pr comment "$PR" --body-file "$F" && echo "posted the review"
          else echo "::warning::the review wrote no verdict line"; fi
  verdict:
    # Agent-free: reads only the pipeline's comment from this run and posts the trusted status.
    needs: review
    if: always() && needs.review.result != 'skipped' && needs.review.outputs.skip != 'true' && needs.review.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      HEAD: ${{ needs.review.outputs.head }}
      NOT_NEEDED: ${{ needs.review.outputs.not-needed }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      # One step ends the stage (pipe finish, finish.mjs): the verdict as the commit status pipeline/ai-review on the
      # commit reviewed (and the label people read), the gate if a person already approved, the card, then what the
      # journey owes (AI_AUTO_CHAIN: changes -> a fix, its start decision capping the rounds; a pass on a UI-facing change
      # -> Claude's UI test, unless one passed or runs on this commit). AI_TRIAGE: before a chained fix, Jev reads the
      # review; findings it is sure are minor or disputed get a comment offering /review-ok instead of a Sonnet round.
      - name: The verdict, then the gate, the card and what comes next
        id: verdict
        env:
          PIPELINE_APP_ID: ${{ secrets.PIPELINE_APP_ID }}
          PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          TYPESAFE_API_KEY: ${{ vars.AI_TRIAGE == 'true' && secrets.TYPESAFE_API_KEY || '' }}
        run: |
          if [ "${{ needs.review.outputs.budget }}" = true ]; then V=budget; elif [ -n "$NOT_NEEDED" ]; then V=not-needed; else V=$(node pipeline/bin/pipe.mjs verdict review "$PR" --since "${{ needs.review.outputs.since }}"); fi
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
          case "$V" in pass|changes|not-needed) ;; *) echo "::warning::no verdict" ;; esac
          node pipeline/bin/pipe.mjs finish review --pr "$PR" --sha "$HEAD" --outcome "$V" --detail "$NOT_NEEDED"
