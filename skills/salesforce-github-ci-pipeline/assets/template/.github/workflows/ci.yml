name: ci
# Static checks, then deploy what changed to the branch's org and run every Apex test. Both job names are required
# checks (branch rules and pipeline/src/conventions.mjs CHECKS). Pipeline code always comes from main (.pipeline/);
# the change is only ever data here.
on:
  pull_request:
  push:
    branches: [main]   # every main commit carries the required checks, so release branches can be cut from it
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to check
        required: true
permissions:
  actions: write        # the nudge job re-runs the gate
  contents: read
  pull-requests: write
  statuses: write       # "UI test not needed" verdict
  checks: write         # the live "Salesforce tests" check
  issues: write         # the story card (nudge)
concurrency:
  group: ci-${{ github.head_ref || inputs.ref || github.ref_name }}   # one CI per branch, whatever started it
  cancel-in-progress: true
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}   # every repository variable (AI switches, PIPELINE_BOTS, UAT_ENABLED...): pipe reads them
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: card turns to one Slack channel (pipeline/src/notify.mjs)
jobs:
  static:
    name: static checks (no org)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # runs the PR's own code (lint, unit tests): no token that can post a verdict
      checks: read          # "What changed?" only: did an earlier commit already pass the Salesforce tests
    env:
      REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
    outputs:
      # decided before any of the PR's code runs (a later step cannot change an earlier step's outputs)
      base: ${{ steps.what.outputs.base }}
      org: ${{ steps.what.outputs.org }}
      ui: ${{ steps.what.outputs.ui }}
      kind: ${{ steps.what.outputs.kind }}       # story | release | backmerge | maintenance (start.branchKind)
      target: ${{ steps.what.outputs.target }}   # the org it tests in
      all: ${{ steps.what.outputs.all }}         # every test (release PRs and back-merges)
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.ref }}", fetch-depth: 0, persist-credentials: false }   # no token left in .git/config
      - name: Trusted pipeline code (main)
        uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\ndata/seed\ndocs/agents\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - run: echo ".pipeline/" >> .git/info/exclude
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Story PRs may not change pipeline code
        run: |
          BASE="${{ github.base_ref }}"; [ -n "$BASE" ] || BASE=main
          git rev-parse -q --verify "origin/$BASE" >/dev/null || { echo "::error::origin/$BASE is not in the checkout"; exit 1; }   # fetch-depth 0 brought every branch
          node .pipeline/pipeline/bin/pipe.mjs gate guard --base "origin/$BASE" --branch "$REF"
      - name: What changed? (decides which checks need a runner; before any of the PR's code runs)
        id: what
        # The scratch-org job: a story's Salesforce changes only. Release PRs and back-merges are covered by the
        # staging regression (required for them instead); with nothing to deploy the job is skipped, which passes.
        # The code analyzer runs only on Salesforce changes. A diff that cannot be read assumes everything.
        # The checkout's own pipe.mjs, like the access check: this job holds no secrets, and the guard above keeps a
        # story's pipeline/ identical to its base (a pipeline PR is tested with the commands it adds).
        # A read-only token for this step alone: an earlier commit whose Salesforce tests passed, with nothing under
        # force-app changed since, carries (no deploy, no Apex run; the skipped check passes, gate.CARRY).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BASE="${{ github.base_ref }}"; [ -n "$BASE" ] || BASE=main
          node pipeline/bin/pipe.mjs ci plan --ref "$REF" --base "$BASE"
      - name: Access check (least privilege; blockers fail, warnings annotate the PR)
        # Main's rules (.pipeline/), not the checkout's: a rule fixed on main applies to every open story at its next
        # push, not after a back-merge (#227). The checkout is only data here.
        run: |
          BASE="${{ github.base_ref }}"; [ -n "$BASE" ] || BASE=main
          node .pipeline/pipeline/bin/pipe.mjs access check --base "origin/$BASE"
      - name: Every changed record-triggered Flow has a Flow test (as every Apex class has tests)
        if: steps.what.outputs.sf == 'true'
        run: |   # main's rule and exceptions, as the access check (#227)
          BASE="${{ github.base_ref }}"; [ -n "$BASE" ] || BASE=main
          node .pipeline/pipeline/bin/pipe.mjs tests flow-gaps --base "origin/$BASE"
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - name: Does the evidence() browser test need Chromium? (only when the helper or its tests changed)
        id: evidence
        run: |
          BASE="${{ github.base_ref }}"; [ -n "$BASE" ] || BASE=main
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(e2e/support/evidence\.ts|pipeline/src/evidence\.mjs|pipeline/test/evidence/)'; then echo "need=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.pipeline/.github/actions/playwright
        if: steps.evidence.outputs.need == 'true'
      - run: npm run test:pipeline
        env: { SLACK_WEBHOOK_URL: "" }   # tests never post to the real channel
      - name: The salesforce-github-ci-pipeline skill matches this pipeline
        run: scripts/skills-sync.sh --check
      - uses: ./.pipeline/.github/actions/sf-auth   # the cached CLI only
        if: steps.what.outputs.sf == 'true'
        with: { login: "false" }
      - name: Code analyzer (PMD and ESLint)
        if: steps.what.outputs.sf == 'true'
        run: |
          sf code-analyzer rules --rule-selector "pmd:Security" --view table 2>/dev/null | grep -E "Apex(CRUD|Sharing|SOQL)" || true   # code-analyzer.yml raises these to 2
          sf code-analyzer run --workspace force-app --severity-threshold 2 --view table
  apex:
    name: deploy and Apex tests (scratch org)
    runs-on: ubuntu-latest
    # A story tests in its own org, release PRs and back-merges in the sprint's staging org: each in that org's lane
    # (pipe lane), so CI never tests code another job deployed meanwhile, and a queued run is never dropped.
    permissions:
      contents: write       # the org's lane only (a ref under refs/locks/); the PR is data here, never run
      pull-requests: write
      checks: write         # the live "Salesforce tests" check
      issues: write         # the story card
      statuses: read        # the card reads the PR's verdicts (without it: "story card not updated", HTTP 403, #220)
      actions: read
    timeout-minutes: 110   # up to 45 waiting for the org's lane, up to 60 for the tests
    needs: static
    # Skipped (which passes the required check, and starts no runner) when no Salesforce metadata changed, and for
    # release PRs and back-merges (the staging regression covers them, also when CI is started by hand). A story
    # started by hand always runs.
    if: >-
      needs.static.outputs.org == 'true' || (github.event_name == 'workflow_dispatch' &&
      needs.static.outputs.kind != 'release' && needs.static.outputs.kind != 'backmerge')
    env:
      REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      temp: ${{ steps.org.outputs.temp }}
      code-failed: ${{ steps.deploy.outcome == 'failure' || steps.tests.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.ref || github.ref }}"
          fetch-depth: 0
      - name: Trusted pipeline code (main)
        uses: actions/checkout@v4
        with: { ref: main, path: .pipeline, sparse-checkout: "pipeline\nscripts\nconfig\n.github/actions\nbaseline\ndata/seed\ndocs/agents\nREVIEW.md\nCLAUDE.md", persist-credentials: false }
      - run: echo ".pipeline/" >> .git/info/exclude
      - name: What does this merge into?
        id: delta
        run: |
          BASE="${{ needs.static.outputs.base }}"
          [ -n "$BASE" ] && [ "${{ github.event_name }}" != workflow_dispatch ] || BASE=$(gh pr list --head "$REF" --state open --json baseRefName --jq '.[0].baseRefName // empty')
          [ -n "$BASE" ] || BASE=main
          git fetch -q origin "$BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --quiet "origin/$BASE...HEAD" -- force-app; then echo "none=true" >> "$GITHUB_OUTPUT"; echo "No force-app changes against $BASE"; else echo "none=false" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.pipeline/.github/actions/sf-auth
        if: steps.delta.outputs.none != 'true'
        with:
          consumer-key: ${{ secrets.SF_CI_CONSUMER_KEY }}
          username: ${{ secrets.SF_CI_USERNAME }}
          private-key: ${{ secrets.SF_CI_PRIVATE_KEY }}
      - name: The story card says CI is running
        if: steps.delta.outputs.none != 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs story card --branch "$REF" --now "CI is deploying the change to its scratch org and testing it"
      - name: The branch's org (a temporary one, with the full source, if it has none)
        if: steps.delta.outputs.none != 'true'
        id: org
        run: |
          TARGET="${{ needs.static.outputs.target }}"   # a story: its own org; a release PR or back-merge: the sprint's staging org
          if node .pipeline/pipeline/bin/pipe.mjs lane acquire "$TARGET"; then echo "lane=$TARGET" >> "$GITHUB_OUTPUT"; fi   # not an org target: a temporary org needs no lane
          if ALIAS=$(node .pipeline/pipeline/bin/pipe.mjs org attach "$TARGET"); then echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          else
            ALIAS="ci-${{ github.run_id }}"
            echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"; echo "temp=true" >> "$GITHUB_OUTPUT"
            node .pipeline/pipeline/bin/pipe.mjs org temp "$ALIAS"
            node .pipeline/pipeline/bin/pipe.mjs org deploy "$ALIAS"
          fi
      - name: Deploy what changed against the base (deletions included)
        id: deploy
        if: steps.delta.outputs.none != 'true'
        env:
          BASE: ${{ steps.delta.outputs.base }}
          ALIAS: ${{ steps.org.outputs.alias }}
        run: |
          mkdir -p delta
          sf sgd source delta --to HEAD --from "origin/$BASE" --output-dir delta --source-dir force-app
          if grep -q '<members>' delta/package/package.xml 2>/dev/null; then
            # deletions: a re-run (or a second CI run in the same org) deletes what is already gone, which Salesforce
            # reports as a warning ("No ApexClass named: X found"); it is not a failure (#353's re-run)
            DESTRUCTIVE=""; grep -q '<members>' delta/destructiveChanges/destructiveChanges.xml 2>/dev/null && DESTRUCTIVE="--post-destructive-changes delta/destructiveChanges/destructiveChanges.xml --ignore-warnings"
            sf project deploy start -o "$ALIAS" --manifest delta/package/package.xml $DESTRUCTIVE --ignore-conflicts --wait 30
          fi
          node .pipeline/pipeline/bin/pipe.mjs org prepare "$ALIAS"
      - name: Tests for this change (Apex and Flow), live on the PR as "Salesforce tests"
        id: tests
        if: steps.delta.outputs.none != 'true'
        env:
          BASE: ${{ steps.delta.outputs.base }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # release PRs and back-merges carry many stories: everything; a story runs what it changed
          ALL: ${{ needs.static.outputs.all == 'true' && '--all' || '' }}
        run: |
          node .pipeline/pipeline/bin/pipe.mjs tests run "${{ steps.org.outputs.alias }}" --base "origin/$BASE" --sha "$SHA" --out test-results $ALL
          # the story org now holds this commit: the UI test's org provisioning finds it ready instead of deploying again
          [ "${{ steps.org.outputs.temp }}" = true ] || [ "${{ needs.static.outputs.kind }}" != story ] || node .pipeline/pipeline/bin/pipe.mjs org advance "${{ steps.org.outputs.alias }}" --sha "$SHA" --base "origin/$BASE" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.delta.outputs.none != 'true'
        with: { name: apex-results, path: test-results, retention-days: 14 }
      - name: The story card says CI failed, and where to look
        if: failure()
        run: node .pipeline/pipeline/bin/pipe.mjs story card --branch "$REF" --now "CI (deploy or tests)" --failed --retry "fix and push; with AI on, a failing deploy or test starts the fixer by itself"
      - name: Let the next job into the org's lane
        if: always() && steps.org.outputs.lane != ''
        run: node .pipeline/pipeline/bin/pipe.mjs lane release "${{ steps.org.outputs.lane }}" || true
      - name: Delete the temporary org
        if: always() && steps.org.outputs.temp == 'true'
        run: node .pipeline/pipeline/bin/pipe.mjs org remove-tagged "${{ steps.org.outputs.alias }}"   # by its tag, via the Dev Hub: works even if creation half-failed
  autofix:
    # Auto-chain (AI_AUTO_CHAIN + AI_FIX): a failed check on a story PR starts ai:fix, which reads the failed output.
    # The fix's start decision (the blocked label, the round limit: pipeline/src/start.mjs) is made by ai-fix's route
    # job, the one door into a fix. Only failures in the change itself (static checks, its deploy, its tests): a lane
    # timeout, a full Dev Hub or a login error is not Claude's to fix. Story branches only: decided here, so no runner
    # starts otherwise.
    needs: [static, apex]
    if: failure() && (needs.static.result == 'failure' || needs.apex.outputs.code-failed == 'true') && github.event_name == 'pull_request' && vars.AI_AUTO_CHAIN == 'true' && vars.AI_FIX == 'true' && needs.static.outputs.kind == 'story'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
      - name: Start ai:fix (as the App, so the label starts the workflow)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label ai:fix   # ai-fix's route decides whether it may run (blocked, rounds)
  nudge:
    # After both required checks have finished (a separate job, so the checks are complete when the gate reads them).
    # The Apex job may be skipped (nothing to deploy): that passes, so the nudge still runs.
    needs: [static, apex]
    if: "!cancelled() && github.event_name != 'push' && needs.static.result == 'success' && (needs.apex.result == 'success' || needs.apex.result == 'skipped')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ inputs.ref || github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # One step ends the stage (pipe finish, finish.mjs): the UI test as not needed when nothing is UI-facing, the gate
      # if a person already approved, the card, then what the journey owes (AI_AUTO_CHAIN: a review that passed before CI
      # finished left Claude's UI test to CI, #230)
      - name: The verdict, then the gate, the card and what comes next
        env:
          PIPELINE_APP_ID: ${{ secrets.PIPELINE_APP_ID }}
          PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          UI: ${{ needs.static.outputs.ui }}
        run: |
          PRN="${{ github.event.pull_request.number }}"
          [ -n "$PRN" ] || PRN=$(gh pr list --head "$REF" --state open --json number --jq '.[0].number // empty')
          [ -n "$PRN" ] || exit 0
          O=""; [ "${{ github.event_name }}" = pull_request ] && [ "$UI" = false ] && O=no-ui
          node pipeline/bin/pipe.mjs finish ci --pr "$PRN" --sha "${{ github.event.pull_request.head.sha }}" --outcome "$O"
