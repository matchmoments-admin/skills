name: lane-wake
# A job that found its org's lane busy parked instead of waiting on a billed runner (pipe lane acquire --park,
# pipeline/src/lane.mjs). When a holder lets go it sends lane-freed; this re-runs every parked job of every free lane
# (one takes the lane, the rest park again). It re-runs only real parked jobs of ai-fix and ui-test (lane.waiterJob):
# a waiter ref is data anyone with contents: write can write. repository_dispatch runs main's copy of this file.
# Run it by hand to wake a job whose holder's runner died without letting go.
on:
  repository_dispatch:
    types: [lane-freed]
  workflow_dispatch:
permissions:
  actions: write        # re-run the parked job
  contents: write       # take its waiter ref off the queue (refs/lane-waits/)
concurrency:
  group: lane-wake   # one wake at a time: two would re-run the same job twice
  cancel-in-progress: false
env:
  PIPELINE_VARS: ${{ toJSON(vars) }}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # up to 5 waiting for the parked run to end (a job re-runs only in a finished run)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "pipeline\nconfig", persist-credentials: false }
      - run: node pipeline/bin/pipe.mjs lane wake
