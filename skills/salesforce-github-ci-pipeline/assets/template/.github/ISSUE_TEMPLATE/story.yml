name: New story
description: Something users should be able to see or do in Salesforce. It becomes a branch, a scratch org and a pull request.
title: "Story: "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Write it the way a user would check it. A **Pipeline status** card appears on the story at once: tick
        **Plan it with Claude** (bigger stories: Claude proposes the build and asks its questions) or **Start** (small
        stories: the branch and a scratch org). Bigger pieces of work: open a **New spec** instead, then tick **Make it a story** on it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Who needs what, and why.
      placeholder: Account managers need to see how long an Account has been a customer, to prioritise long-standing customers.
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One line each. Say what a user sees, not how to build it.
      placeholder: |
        - A Customer Since date field exists on Account
        - Customer Years shows whole years since Customer Since, blank when it is blank
        - Both fields are on the Account record page
    validations: { required: true }
  - type: textarea
    id: access
    attributes:
      label: Access
      description: Who may see or change it (which permission set), and anything about record sharing. "No change" is fine; Claude's plan fills in the rest.
      placeholder: Sales reps with the Sales Region Access permission set see and edit it; nobody else sees it.
  - type: input
    id: approver
    attributes:
      label: Approver
      description: Who approves this story before it merges (a GitHub login, e.g. @alex). Leave blank for anyone on the team's approver list (the APPROVERS setting). Whoever pushes the latest change cannot approve it.
      placeholder: "@alex"
  - type: textarea
    id: where
    attributes:
      label: Where to see it in the UI
      description: The clicks a tester follows. The UI test is written from this.
      placeholder: Open an Account, set Customer Since to a date three years ago and save. Customer Years shows 3.
    validations: { required: true }
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      value: Anything not listed above.
