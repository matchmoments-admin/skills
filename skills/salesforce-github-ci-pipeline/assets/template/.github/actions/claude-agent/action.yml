name: claude-agent
description: >-
  Run Claude for one pipeline role (implement, fix, review, ui-test). Appends the role's output-format rules and the
  shell rule from pipeline/src/verdict.mjs (the same module that parses the results), and keeps the transcript.
  The job needs permissions id-token: write. Production access is dropped first.
inputs:
  role: { required: true, description: "implement | fix | review | ui-test" }
  prompt: { required: true, description: "What to do, in plain words" }
  key: { required: false, default: "N", description: "Story key, used in commit formats" }
  pr: { required: false, default: "", description: "Pull request number, for the event log (fix rounds, cost per PR)" }
  max-turns: { required: false, default: "", description: "Turn cap override; empty = the role's budget (pipeline/src/roles.mjs)" }
  allowed-tools: { required: true, description: "Comma-separated tool allow-list" }
  oauth-token: { required: true, description: "secrets.CLAUDE_CODE_OAUTH_TOKEN (the anthropic provider)" }
  api-key: { required: false, default: "", description: "secrets.ANTHROPIC_API_KEY: the anthropic-api provider's key, or the gateway's" }
  changed-files: { required: false, default: "", description: "A file listing the PR's changed paths, one a line: a review of a change with no code, access or automation may use a cheaper model" }
  github-token: { required: true, description: "Token Claude acts with on GitHub" }
  allowed-bots: { required: false, default: "", description: "Bot actors allowed to trigger this run (vars.PIPELINE_BOTS)" }
  model: { required: false, default: "", description: "Model override for this run ('model', 'alias' or 'provider:model'); empty = config/ai-models.json, AI_MODEL_<ROLE> and AI_MODEL" }
runs:
  using: composite
  steps:
    - name: Drop production access before the agent starts
      # The agent works only in scratch orgs and on GitHub as the pipeline App. It never holds the production
      # (Dev Hub) login or the CI certificate, and never the Actions token that posts verdicts.
      shell: bash
      run: |
        sf org logout -o devhub --no-prompt >/dev/null 2>&1 || true
        rm -f "${SF_CI_KEY_FILE:-}" "$RUNNER_TEMP/ci.key"
        echo "SF_CI_KEY_FILE=" >> "$GITHUB_ENV"
        sf org list --json 2>/dev/null | jq -r '[.result.nonScratchOrgs[]?.alias] | "non-scratch logins left: \(length)"' || true
    - id: rules
      shell: bash
      env:
        # this step only (the agent never gets it): the event log's branch, read for the story's AI spend so far
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
        GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ inputs.github-token }}"
      run: |
        {
          echo 'text<<__RULES__'
          node .pipeline/pipeline/bin/pipe.mjs verdict instructions "${{ inputs.role }}" --key "${{ inputs.key }}"
          echo '__RULES__'
        } >> "$GITHUB_OUTPUT"
        # provider=, model=, turns=, arm= and the provider's login settings (config/ai-models.json, pipeline/src/roles.mjs)
        AI_MODEL="${{ inputs.model }}" node .pipeline/pipeline/bin/pipe.mjs agent budget "${{ inputs.role }}" --key "${{ inputs.key }}" ${{ inputs.changed-files && format('--changed "{0}"', inputs.changed-files) || '' }}
        [ -z "${{ inputs.max-turns }}" ] || echo "turns=${{ inputs.max-turns }}" >> "$GITHUB_OUTPUT"
    - name: Stop when the story's AI budget is spent (AI_STORY_BUDGET_USD; an approver's /budget-ok adds as much again)
      if: steps.rules.outputs.stop == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        KEY: ${{ inputs.key }}
        PR: ${{ inputs.pr }}
        SPENT: ${{ steps.rules.outputs.spent }}
        CAP: ${{ steps.rules.outputs.cap }}
      run: |
        MSG="⏸ Story $KEY has used \$$SPENT of its \$$CAP AI budget, so no AI agent starts on it. An approver can comment \`/budget-ok <why>\` to add as much again (AI_STORY_BUDGET_USD), or a person can take it from here."
        if [ -n "$PR" ]; then gh pr comment "$PR" --body "$MSG" || true; gh pr edit "$PR" --add-label blocked || true
        elif [ "$KEY" != N ]; then gh issue comment "$KEY" --body "$MSG" || true; gh issue edit "$KEY" --add-label blocked || true; fi
        echo "::error::story $KEY is over its AI budget (\$$SPENT of \$$CAP)"; exit 1
    - name: Log in to AWS for Bedrock (GitHub's OIDC identity: no stored key)
      if: steps.rules.outputs.auth == 'aws-oidc'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.rules.outputs.aws_role }}
        aws-region: ${{ steps.rules.outputs.aws_region }}
    - name: Log in to Google Cloud for Vertex AI (workload identity federation: no stored key)
      if: steps.rules.outputs.auth == 'gcp-wif'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ steps.rules.outputs.gcp_provider }}
        service_account: ${{ steps.rules.outputs.gcp_account }}
    - id: claude
      uses: anthropics/claude-code-action@v1
      continue-on-error: true   # judged below from the transcript: a finished run that went past the turn cap is a success
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents ran tests in the background and ended before committing (F22, story #54)
      with:
        claude_code_oauth_token: ${{ steps.rules.outputs.auth == 'oauth' && inputs.oauth-token || '' }}
        anthropic_api_key: ${{ contains(fromJSON('["api-key","gateway"]'), steps.rules.outputs.auth) && inputs.api-key || '' }}
        use_bedrock: ${{ steps.rules.outputs.auth == 'aws-oidc' }}
        use_vertex: ${{ steps.rules.outputs.auth == 'gcp-wif' }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: |
          ${{ inputs.prompt }}
          ${{ steps.rules.outputs.text }}
        claude_args: >-
          --model ${{ steps.rules.outputs.model }}
          --max-turns ${{ steps.rules.outputs.turns }}
          --allowedTools "${{ inputs.allowed-tools }}"
    - name: Did the agent finish? (its own result, not the turn cap)
      shell: bash
      env:
        OUTCOME: ${{ steps.claude.outcome }}
        OUT: ${{ runner.temp }}/claude-execution-output.json
      run: |
        [ "$OUTCOME" = success ] && exit 0
        # the action fails a run that ended with a success result after more turns than --max-turns (story #143 took
        # 69 of 60 and opened its PR); that is a finished run. Anything else (an error result, no result) still fails.
        R=$( [ -s "$OUT" ] && jq -r '[.[] | select(.type == "result")] | last | "\(.subtype // "") \(.is_error | tostring)"' "$OUT" 2>/dev/null || echo "")
        if [ "${R%% *}" = "error_max_turns" ] && [ "${{ steps.rules.outputs.turnLimitOk }}" = "true" ]; then echo "::warning::The agent used all ${{ steps.rules.outputs.turns }} turns; its work is judged by the next job (pipeline/src/roles.mjs turnLimitOk)."; exit 0; fi
        if [ "$R" = "success false" ]; then echo "::warning::The agent finished successfully but used more turns than ${{ steps.rules.outputs.turns }}: counted as success. Raise this role's turns in pipeline/src/roles.mjs if it keeps happening."; exit 0; fi
        echo "::error::The agent did not finish (result: ${R:-none})"; exit 1
    - name: Record the agent's cost and turns in the event log (needs contents write on the job's token)
      if: always()
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        KEY: ${{ inputs.key }}
        PR: ${{ inputs.pr }}
        MODEL: ${{ steps.rules.outputs.model }}
        PROVIDER: ${{ steps.rules.outputs.provider }}
        ARM: ${{ steps.rules.outputs.arm }}
      run: node .pipeline/pipeline/bin/pipe.mjs event agent --role "$ROLE" --key "$KEY" ${PR:+--pr "$PR"} --model "$MODEL" --provider "$PROVIDER" ${ARM:+--arm "$ARM"} --file "$RUNNER_TEMP/claude-execution-output.json" || true
    - name: Keep the AI transcript (audit trail)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: claude-transcript-${{ inputs.role }}-${{ github.run_id }}
        path: ${{ runner.temp }}/claude-execution-output.json
        retention-days: 30   # the weekly metrics read cost and turns from these
        if-no-files-found: ignore
