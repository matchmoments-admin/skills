# The Slack actions Worker (pipeline/slack/worker.mjs). Deploy from this folder: npx wrangler deploy
# Secrets (never here): npx wrangler secret put SLACK_SIGNING_SECRET | SLACK_BOT_TOKEN | GITHUB_TOKEN
name = "sf-pipeline-slack"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

# keep the Worker's logs (one JSON line per click) in the dashboard: Workers › sf-pipeline-slack › Logs
[observability]
enabled = true

[vars]
GITHUB_REPO = "__OWNER__/__project__"
# SLACK_USERS ({"<Slack user ID>": "<GitHub login>"}: who may act from Slack, and as whom) is a secret too, so the
# repo stays generic and a deploy never resets it: echo '{"U0123ABC":"login"}' | npx wrangler secret put SLACK_USERS
